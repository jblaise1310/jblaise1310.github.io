<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#e7e8eb; }
    @media print {
      @page { size: landscape; margin: 7mm; }
      body { background:#ffffff !important; }
    }
  </style>
</helmet>
<div style="min-height:100vh; box-sizing:border-box; padding:24px 18px 44px; font-family:Inter,system-ui,sans-serif; color:#1f2937; background:#e7e8eb; display:flex; flex-direction:column; align-items:center;">

  <div ref="{{ setScaler }}" style="width:1320px; display:flex; flex-direction:column; align-items:stretch; gap:18px;">

  <div style="width:1320px; max-width:100%; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;">
    <div>
      <div style="font-size:11px; font-weight:700; letter-spacing:.24em; color:#8a8f99;">WHO SITS WHERE &middot; LIVE ASSIGNMENTS</div>
      <div style="font-size:36px; font-weight:800; letter-spacing:-.02em; margin-top:4px;">{{ title }}</div>
      <div style="display:inline-flex; gap:4px; padding:4px; background:rgba(15,23,42,.05); border:1px solid rgba(15,23,42,.1); border-radius:11px; margin-top:14px;">
        <a href="Floor 1 Map.dc.html" style="padding:7px 20px; border-radius:8px; font-size:13.5px; font-weight:600; color:#5a6475; text-decoration:none; transition:background .15s ease;" style-hover="background:rgba(15,23,42,.07)">Current</a>
        <span style="padding:7px 20px; border-radius:8px; font-size:13.5px; font-weight:700; background:#16202e; color:#ffffff;">Proposed</span>
      </div>
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; max-width:820px;">
      <sc-for list="{{ legend }}" as="L" hint-placeholder-count="6">
        <button style="{{ L.style }}" onClick="{{ L.onClick }}">
          <span style="{{ L.dotStyle }}"></span>{{ L.name }}
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position:relative; width:1320px; height:970px; border-radius:16px; overflow:hidden; border:1px solid rgba(15,23,42,.09); background:radial-gradient(1300px 700px at 32% -5%, #ffffff, #eef0f3 72%); box-shadow:0 20px 50px rgba(15,23,42,.12), inset 0 1px 0 rgba(255,255,255,.6);">
    <div style="position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(15,23,42,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.035) 1px,transparent 1px); background-size:40px 40px;"></div>

    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="40">
      <div style="{{ c.style }}" style-hover="{{ c.hover }}" onClick="{{ c.onClick }}">
        <div style="{{ c.labelStyle }}">{{ c.label }}</div>
        <sc-if value="{{ c.sub }}" hint-placeholder-val="{{ true }}">
          <div style="{{ c.subStyle }}">{{ c.sub }}</div>
        </sc-if>
        <sc-if value="{{ c.micro }}" hint-placeholder-val="{{ true }}">
          <div style="{{ c.microStyle }}">{{ c.micro }}</div>
        </sc-if>
        <sc-if value="{{ c.ext }}" hint-placeholder-val="{{ true }}">
          <div style="{{ c.extStyle }}">{{ c.ext }}</div>
        </sc-if>
        <sc-if value="{{ c.flagText }}" hint-placeholder-val="{{ true }}">
          <div style="{{ c.vacStyle }}">{{ c.flagText }}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="width:1320px; max-width:100%; display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:#6b7280; font-weight:500;">
    <span>Click a team to highlight where they sit &middot; click again to clear &middot; dashed outline = proposed change</span>
    <span style="font-family:'JetBrains Mono',monospace; color:#b45309; font-weight:600;">{{ vacancyLine }}</span>
  </div>
  <div style="width:1320px; max-width:100%; font-size:11.5px; color:#b45309; font-weight:600; text-align:right; margin-top:-10px;">{{ noteLine }}</div>

  </div>

  <button ref="{{ setPrintBtn }}" onClick="{{ doPrint }}" style="position:fixed; right:22px; bottom:22px; z-index:50; display:inline-flex; align-items:center; gap:9px; padding:13px 19px; border-radius:12px; border:1px solid rgba(15,23,42,.12); background:#16202e; color:#ffffff; font-family:Inter,system-ui,sans-serif; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 12px 26px rgba(15,23,42,.24);" style-hover="background:#243244">
    <span style="font-size:16px; line-height:1;">&#x23CF;</span>Print / Save PDF
  </button>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1380,&quot;height&quot;:1020},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;stripe&quot;,&quot;filled&quot;,&quot;outline&quot;],&quot;default&quot;:&quot;stripe&quot;,&quot;tsType&quot;:&quot;'stripe'|'filled'|'outline'&quot;}}">
class Component extends DCLogic {
  state = { focus: null };

  setScaler = (el) => { this.scalerEl = el; };
  setPrintBtn = (el) => { this.printBtnEl = el; };
  doPrint = () => { window.print(); };

  fit = () => {
    if (!this.scalerEl) return;
    const el = this.scalerEl;
    el.style.zoom = 1;
    const natW = el.offsetWidth, natH = el.offsetHeight;
    const availW = window.innerWidth - 32;
    const availH = window.innerHeight - 76;
    let s = Math.min(availW / natW, availH / natH);
    s = Math.max(0.4, Math.min(s, 1.7));
    el.style.zoom = s;
  };

  onBeforePrint = () => {
    if (this.scalerEl) this.scalerEl.style.zoom = 0.64;
    if (this.printBtnEl) this.printBtnEl.style.display = 'none';
  };
  onAfterPrint = () => {
    if (this.printBtnEl) this.printBtnEl.style.display = '';
    this.fit();
  };

  componentDidMount() {
    this.fit();
    this._onResize = () => this.fit();
    window.addEventListener('resize', this._onResize);
    window.addEventListener('beforeprint', this.onBeforePrint);
    window.addEventListener('afterprint', this.onAfterPrint);
    this._mql = window.matchMedia('print');
    this._mqlHandler = (e) => { e.matches ? this.onBeforePrint() : this.onAfterPrint(); };
    if (this._mql.addEventListener) this._mql.addEventListener('change', this._mqlHandler);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('beforeprint', this.onBeforePrint);
    window.removeEventListener('afterprint', this.onAfterPrint);
    if (this._mql && this._mql.removeEventListener) this._mql.removeEventListener('change', this._mqlHandler);
  }

  teams = {
    green:      { name: 'Green',      color: '#34d399' },
    ortho:      { name: 'Ortho',      color: '#c9a227' },
    specialty:  { name: 'Pulmonary',  color: '#a78bfa' },
    neurology:  { name: 'Neurology',  color: '#f97316' },
    triage:     { name: 'Triage',     color: '#1e3a8a' },
    behavioral: { name: 'Behavioral', color: '#ec4899' },
    discharge:  { name: 'Discharge',  color: '#0891b2' },
  };

  rawCells = [
    // zones (behind everything)
    { k:'zone', x:664, y:76, w:424, h:266, label:'PROVIDER POD' },
    { k:'zone', x:664, y:356, w:424, h:470, label:'NURSE & WORK STATIONS' },
    // counters — flank the workstation columns
    { k:'counter', x:666, y:372, w:16, h:236 },
    { k:'counter', x:666, y:614, w:16, h:196 },
    { k:'counter', x:1026, y:372, w:16, h:236 },
    { k:'counter', x:1026, y:614, w:16, h:196 },
    // left exam rooms
    { k:'room', team:'green', x:356, y:132, w:132, h:84, label:'Room 11', sub:'Dr. Renfrew (Nov.)', micro:'MA Vacant', ext:'Available Mon' },
    { k:'room', team:'green', x:356, y:228, w:132, h:84, label:'Room 10', sub:'Dr. Renfrew (Nov.)', micro:'MA Vacant', ext:'Available Mon' },
    { k:'room', team:'green', x:356, y:376, w:132, h:92, label:'Room 9',  sub:'Walkin: Dr. Brown / Liverett',  micro:'MA · Alex (M,T)', ext:'Vacant (W-F)' },
    { k:'room', team:'green', x:356, y:490, w:132, h:82, label:'Room 8',  sub:'Barber / Zappone',  micro:'MA · David' },
    { k:'room', team:'green', x:356, y:604, w:132, h:82, label:'Room 7',  sub:'Barber / Zappone',  micro:'MA · David' },
    // far left cluster
    { k:'room', team:'neurology', x:32,  y:610, w:94, h:90, label:'Dr. Montano', sub:'Neurology Office', micro:'Desk: APRN · Vacant' },
    { k:'room', team:'specialty', x:32,  y:712, w:94, h:90, label:'Dr. Holcomb', sub:'Pulmonary Office' },
    { k:'hall', x:32, y:826, w:1164, h:32, label:'HALLWAY' },
    { k:'room', team:'behavioral', x:32, y:872, w:94, h:80, label:'BH',   sub:'Jake / Courtney', ext:'Ext. 3893' },
    { k:'room', team:'ortho',      x:136, y:712, w:94, h:90, label:'Rm 6', sub:'Ortho Procedure', micro:'MA · Pricilla / Vacant' },
    { k:'room', team:'ortho',      x:136, y:872, w:94, h:80, label:'Rm 5', sub:'Ortho', micro:'MA · Pricilla / Vacant' },
    { k:'room', team:'ortho',      x:244, y:872, w:90, h:80, label:'Rm 4', sub:'Ortho', micro:'MA · Pricilla / Vacant' },
    // provider pod plates — left
    { k:'plate', team:'ortho', x:690, y:104, w:156, h:70, label:'Webb',  sub:'Ortho Physician', ext:'Ext. 3920' },
    { k:'plate', team:'green', x:690, y:182, w:156, h:70, label:'Dr. Renfrew', sub:'Green Physician · Nov \'26', ext:'Ext. 3880' },
    { k:'plate', team:'ortho', x:690, y:260, w:156, h:70, label:'Steed', sub:'Ortho Physician', ext:'Ext. 3953' },
    // provider pod plates — right
    { k:'plate', team:'green', x:866, y:104, w:156, h:70, label:'Zappone / Barber', sub:'Primary Care',     ext:'Ext. 3880' },
    { k:'plate', team:'green', x:866, y:182, w:156, h:70, label:'Dr. Gray',  sub:'Walk-In Provider', ext:'Ext. 3756' },
    { k:'plate', team:'green', x:866, y:260, w:156, h:70, label:'Dr. Brown / Liverett', sub:'Walk-In Provider', ext:'Ext. 3868' },
    // left workstations
    { k:'ws', team:'ortho', x:690, y:372, w:156, h:58, label:'L6 · Tori',   sub:'RN · Ortho', ext:'Ext. 3919' },
    { k:'ws', team:'ortho', vacant:true, x:690, y:436, w:156, h:100, label:'L5 · Vacant', sub:'MA · Steed', ext:'Ext. 3885' },
    { k:'ws', team:'green', x:690, y:542, w:156, h:78, label:'L4 · Alec (M-T)', sub:'MA · Walk-In/Aspen', micro:'Vacant (W-F)', ext:'Ext. 3997' },
    { k:'ws', team:'green', x:690, y:626, w:156, h:68, label:'L3 · David',  sub:'MA · Barber / Zappone', ext:'Ext. 3797' },
    { k:'ws', team:'specialty', x:690, y:700, w:156, h:58, label:'L2 · Ariana', sub:'RN · Specialty', ext:'Ext. 3886' },
    { k:'ws', team:'triage', x:690, y:764, w:156, h:58, label:'L1 · Megan', sub:'Lead RN', ext:'Ext. 3873' },
    // right workstations
    { k:'ws', team:'ortho', x:866, y:372, w:156, h:58, label:'R6 · Pricilla', sub:'MA · Webb', ext:'Ext. 3950' },
    { k:'ws', team:'ortho', x:866, y:436, w:76, h:100, label:'R5 · Paula', sub:'PSR · Ortho', ext:'Ext. 3986' },
    { k:'ws', team:'green', x:946, y:436, w:76, h:100, label:'R5 · Paula', sub:'PSR · Green' },
    { k:'ws', team:'green', vacant:true, x:866, y:542, w:156, h:78, label:'R4 · Vacant', sub:'MA · Green Physician' },
    { k:'ws', team:'green', x:866, y:626, w:156, h:68, label:'R3 · Tyler (8/3/26)', sub:'RN · Green', ext:'Ext. 3887' },
    { k:'ws', team:'specialty', vacant:true, x:866, y:700, w:156, h:58, label:'R2 · Vacant', sub:'MA · Neurology' },
    { k:'ws', team:'specialty', x:866, y:764, w:156, h:58, label:'R1 · Brandy', sub:'MA · Pulmonary', ext:'Ext. 3997' },
    // right rooms
    { k:'room', team:'green', x:1126, y:128, w:122, h:80, label:'Room 12', sub:'Aspen Room',     micro:'MA · Vacant' },
    { k:'room', team:'green', x:1126, y:220, w:122, h:80, label:'Room 13', sub:'Aspen Room',     micro:'MA · Vacant' },
    { k:'room', team:'green', x:1126, y:364, w:122, h:96, label:'Room 14', sub:'Walkin: Dr. Brown / Liverett', micro:'MA · Alex (M,T)', ext:'Vacant (W-F)' },
    { k:'room', team:'neurology', x:1126, y:490, w:122, h:92, label:'Room 15', sub:'Neurologist · Dr. Montano (Nov \'26)', micro:'MA · Consider Ruth' },
    { k:'room', team:'neurology', x:1126, y:594, w:122, h:92, label:'Room 16', sub:'Neurologist · Dr. Montano (Nov \'26)', micro:'MA · Consider Ruth' },
    { k:'util', x:1126, y:698, w:122, h:54, label:'Scale Area' },
    // bottom service row
    { k:'room', team:'discharge', vacant:true, dense:true, x:350, y:872, w:216, h:40, label:'Discharge 1', sub:'Specialty PSR · Clinic Facing', ext:'Ext. 3907' },
    { k:'room', team:'discharge', dense:true,  x:350, y:914, w:216, h:40, label:'Discharge 1', sub:'Dakoda · Waiting Rm Facing', ext:'Ext. 3951' },
    { k:'util', x:582, y:872, w:74,  h:80, label:'Pt. Bathroom' },
    { k:'util', x:664, y:872, w:74,  h:80, label:'Med Room' },
    { k:'room', team:'triage',    x:790, y:872, w:120, h:80, label:'Room 3', sub:'Nurse / Triage' },
    { k:'room', team:'specialty', x:932, y:872, w:120, h:80, label:'Room 2', sub:'Holcomb', micro:'MA · Brandy' },
    { k:'room', team:'specialty', x:1076, y:872, w:120, h:80, label:'Room 1', sub:'Holcomb', micro:'MA · Brandy' },
  ];

  hexToRgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  buildCell(c, v, focus) {
    const t = c.team ? this.teams[c.team] : null;
    const color = c.colorOverride || (t ? t.color : null);
    const interactive = (c.k === 'room' || c.k === 'plate' || c.k === 'ws');
    const dim = focus && c.team !== focus && c.k !== 'zone' && c.k !== 'counter' && c.k !== 'hall';

    const base = {
      position: 'absolute', left: c.x, top: c.y, width: c.w, height: c.h, boxSizing: 'border-box',
      display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: c.dense ? 0 : 2,
      padding: c.dense ? '3px 9px' : '7px 10px', borderRadius: 8, overflow: 'hidden',
      opacity: dim ? 0.2 : 1, transition: 'opacity .18s ease, transform .15s ease, filter .15s ease',
      cursor: interactive ? 'pointer' : 'default',
    };

    if (c.k === 'hall') {
      Object.assign(base, { alignItems: 'center', justifyContent: 'center',
        background: 'repeating-linear-gradient(90deg,rgba(15,23,42,.05),rgba(15,23,42,.05) 10px,transparent 10px,transparent 20px)',
        border: '1px dashed rgba(15,23,42,.16)', borderRadius: 8, zIndex: 0 });
      return { style: base, label: c.label,
        labelStyle: { fontSize: 10, fontWeight: 700, letterSpacing: '.3em', color: '#9aa6b3' } };
    }
    if (c.k === 'zone') {
      Object.assign(base, { justifyContent: 'flex-start', alignItems: 'flex-start', padding: '4px 11px',
        background: 'rgba(15,23,42,.018)', border: '1px solid rgba(15,23,42,.08)', borderRadius: 11, zIndex: 0 });
      return { style: base, label: c.label,
        labelStyle: { fontSize: 8.5, fontWeight: 700, letterSpacing: '.16em', color: '#9aa6b3' } };
    }
    if (c.k === 'counter') {
      Object.assign(base, { background: 'rgba(100,116,139,.08)', border: '1px dashed rgba(100,116,139,.3)',
        alignItems: 'center', justifyContent: 'center', borderRadius: 5, zIndex: 1 });
      return { style: base, label: 'COUNTER',
        labelStyle: { writingMode: 'vertical-rl', transform: 'rotate(180deg)', fontSize: 8.5, letterSpacing: '.26em', color: '#7b8696', fontWeight: 600 } };
    }
    if (c.k === 'util') {
      Object.assign(base, { background: 'linear-gradient(180deg,#3a4150,#2b313c)', border: '1px solid rgba(15,23,42,.22)',
        alignItems: 'center', justifyContent: 'center', zIndex: 2 });
      return { style: base, label: c.label,
        labelStyle: { fontSize: 12, fontWeight: 600, color: '#e7ebf1', textAlign: 'center', lineHeight: 1.15 } };
    }

    // team / room cells
    base.zIndex = 2;
    let labelColor = '#1f2a37';
    if (!t) {
      base.background = c.vacant
        ? 'repeating-linear-gradient(45deg,#f1f3f5,#f1f3f5 7px,#e6eaee 7px,#e6eaee 14px)'
        : '#ffffff';
      base.border = '1px ' + (c.vacant ? 'dashed' : 'solid') + ' rgba(15,23,42,.16)';
    } else if (v === 'outline') {
      base.background = '#ffffff';
      base.border = '1.5px ' + (c.vacant ? 'dashed' : 'solid') + ' ' + color;
    } else if (v === 'stripe') {
      base.background = '#ffffff';
      base.border = '1px solid rgba(15,23,42,.1)';
      base.borderTop = '5px ' + (c.vacant ? 'dashed' : 'solid') + ' ' + color;
      base.paddingTop = c.dense ? 3 : 7;
    } else { // filled (default)
      base.background = this.hexToRgba(color, 0.16);
      base.border = '1px solid ' + this.hexToRgba(color, 0.42);
      base.borderLeft = '4px ' + (c.vacant ? 'dashed' : 'solid') + ' ' + color;
    }
    if (c.vacant) labelColor = '#647488';

    const microVac = c.micro && /vacant/i.test(c.micro);
    const flagText = c.vacant ? 'VACANT' : (c.flag || null);
    return {
      style: base,
      label: c.label, sub: c.sub || '', micro: c.micro || '', ext: c.ext || '', flagText,
      extStyle: { fontSize: c.dense ? 11 : 12.5, fontWeight: 800, letterSpacing: '.02em', marginTop: c.dense ? 1 : 3,
        fontFamily: 'JetBrains Mono, monospace', color: '#0b1320' },
      labelStyle: { fontSize: c.dense ? 11 : 13, fontWeight: 700, color: labelColor, lineHeight: 1.1, letterSpacing: '-.01em' },
      subStyle: { fontSize: c.dense ? 10 : 11, fontWeight: 600, lineHeight: 1.15, color: '#5a6475' },
      microStyle: { fontSize: 9.5, fontWeight: 600, letterSpacing: '.02em', marginTop: 1,
        fontFamily: 'JetBrains Mono, monospace', color: microVac ? '#b45309' : '#7c8696' },
      vacStyle: { position: 'absolute', top: 6, right: 7, fontSize: 8, fontWeight: 800, letterSpacing: '.1em',
        color: '#475569', background: t ? this.hexToRgba(color, 0.14) : 'rgba(15,23,42,.06)',
        border: '1px solid ' + (t ? this.hexToRgba(color, 0.45) : 'rgba(15,23,42,.18)'), padding: '2px 5px', borderRadius: 4 },
      hover: { transform: 'translateY(-2px)', filter: 'brightness(1.14)', zIndex: 6 },
      onClick: c.team ? () => this.setFocus(c.team) : null,
    };
  }

  setFocus(id) {
    this.setState({ focus: this.state.focus === id ? null : id });
  }

  renderVals() {
    const v = this.props.variant || 'stripe';
    const focus = this.state.focus;

    const cells = this.rawCells.map(c => this.buildCell(c, v, focus));

    const lum = (hex) => {
      const n = parseInt(hex.slice(1), 16);
      return 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
    };
    const legend = Object.entries(this.teams).map(([id, t]) => {
      const active = focus === id;
      const activeText = lum(t.color) < 140 ? '#ffffff' : '#16202e';
      return {
        name: t.name,
        onClick: () => this.setFocus(id),
        style: {
          display: 'inline-flex', alignItems: 'center', gap: 7, padding: '7px 12px', borderRadius: 999,
          fontFamily: 'Inter, sans-serif', fontSize: 12.5, fontWeight: 600, cursor: 'pointer',
          color: active ? activeText : '#3f4756',
          background: active ? t.color : 'rgba(15,23,42,.05)',
          border: '1px solid ' + (active ? t.color : 'rgba(15,23,42,.12)'),
          transition: 'all .15s ease',
        },
        dotStyle: { width: 9, height: 9, borderRadius: 3, background: t.color, flex: 'none' },
      };
    });

    const vac = this.rawCells.filter(c => c.vacant).length;
    return {
      title: 'Floor 1 (Proposed)',
      cells, legend,
      setScaler: this.setScaler, setPrintBtn: this.setPrintBtn, doPrint: this.doPrint,
      vacancyLine: vac + ' open seats / rooms',
      noteLine: 'Note: R2 — consider Ruth (Sept \'26) for coverage',
    };
  }
}

</script>
</body>
</html>
