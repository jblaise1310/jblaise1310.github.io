<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCC Director View -- Provider 1:1 Q1 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --teal:#0F6E56;--tmd:#1D9E75;--tlt:#E1F5EE;--tbd:#9FE1CB;
  --pur:#534AB7;--plt:#EEEDFE;
  --red:#A32D2D;--rlt:#FADBD8;--rbd:#F7C1C1;
  --grn:#1E8449;--glt:#D5F5E3;--gbd:#A9DFBF;
  --amb:#D4830A;--alt:#FAEEDA;--abd:#FAC775;
  --blu:#185FA5;--blt:#E6F1FB;
  --grey:#F4F4F4;--gbd2:#D1D5DB;
  --text:#1A202C;--t2:#4A5568;--t3:#718096;
  --bdr:#E2E8F0;--surf:#FFFFFF;--bg:#F7F8FA;
  --r:8px;--rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
/* Top bar */
.topbar{background:#1A1A2E;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.tb-title{font-size:15px;font-weight:600;color:#fff}
.tb-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.tb-badge{font-size:11px;font-weight:500;background:#A32D2D;color:#fff;padding:4px 12px;border-radius:99px}
/* Shell */
.shell{max-width:1100px;margin:0 auto;padding:24px 28px 60px}
/* Provider selector */
.sel-bar{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sel-bar label{font-size:14px;font-weight:500;color:var(--text)}
.sel-bar select{font-size:14px;padding:9px 16px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--surf);color:var(--text);min-width:220px;cursor:pointer}
.print-btn{margin-left:auto;background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:9px 20px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px}
.print-btn:hover{background:#0d5c49}
/* Provider report */
#report{display:none}#report.on{display:block}
/* Header card */
.rh{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:22px 26px;margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.rn{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.rm{font-size:13px;color:var(--t2);line-height:1.7}
.rs{font-size:12px;font-weight:600;padding:5px 14px;border-radius:99px;white-space:nowrap}
.rs-note{font-size:11px;color:var(--t3);margin-top:4px;max-width:280px;text-align:right;line-height:1.4}
/* Section header */
.sh{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--bdr)}
/* KPI grid */
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 16px;text-align:center}
.kl{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.kv{font-size:24px;font-weight:700;line-height:1;color:var(--text)}
.kv.g{color:var(--grn)}.kv.a{color:var(--amb)}.kv.r{color:var(--red)}
.ks{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.4}
/* Chart grids */
.cg1{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:20px}
.cg2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:800px){.cg2{grid-template-columns:1fr}}
.cc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:18px 20px}
.ct{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:12px}
.cw{position:relative;width:100%}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--t3)}
.li{display:flex;align-items:center;gap:4px}
.ls{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* Burnout score */
.burn-wrap{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:18px 22px;margin-bottom:20px}
.burn-score-row{display:flex;align-items:center;gap:20px;margin-bottom:14px}
.burn-score-circle{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:3px solid}
.burn-score-num{font-size:24px;font-weight:700;line-height:1}
.burn-score-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em}
.burn-bars{flex:1}
.bbar-row{display:grid;grid-template-columns:130px 1fr 48px;align-items:center;gap:10px;margin-bottom:8px}
.bbar-label{font-size:12px;color:var(--t2);text-align:right}
.bbar-track{height:8px;background:var(--grey);border-radius:4px;overflow:hidden}
.bbar-fill{height:8px;border-radius:4px}
.bbar-val{font-size:11px;font-weight:500;color:var(--t2)}
/* Items of note */
.note-grid{display:flex;flex-direction:column;gap:0;border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;margin-bottom:20px}
.note-item{display:grid;grid-template-columns:32px 1fr;border-bottom:1px solid #EEF0F4}
.note-item:last-child{border-bottom:none}
.note-num{background:var(--plt);color:var(--pur);font-size:13px;font-weight:700;display:flex;align-items:flex-start;justify-content:center;padding:16px 0 0;border-right:1px solid #EEF0F4}
.note-body{padding:14px 18px}
.note-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
.note-text{font-size:13px;line-height:1.7;color:var(--t2)}
/* Action items */
.action-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:20px}
.action-table th{text-align:left;padding:8px 12px;font-weight:600;font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;background:var(--grey);border-bottom:2px solid var(--bdr)}
.action-table td{padding:10px 12px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.action-table tr:last-child td{border-bottom:none}
.status-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
/* Talking points / conversation guide */
.tp-grid{display:flex;flex-direction:column;gap:0;border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;margin-bottom:20px}
.tp-item{display:grid;grid-template-columns:26px 1fr;border-bottom:1px solid #EEF0F4}
.tp-item:last-child{border-bottom:none}
.tp-num{background:var(--tlt);color:var(--teal);font-size:12px;font-weight:700;display:flex;align-items:flex-start;justify-content:center;padding:14px 0 0;border-right:1px solid #EEF0F4}
.tp-body{padding:13px 16px}
.tp-label{font-size:11px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.tp-q{font-size:13px;font-weight:600;color:var(--text);font-style:italic;line-height:1.6}
/* Forecast chart caption */
.forecast-note{font-size:11px;color:var(--t3);margin-top:8px;line-height:1.5;border-top:1px solid var(--bdr);padding-top:8px}
/* Analysis cards */
.ac{border-radius:var(--rl);padding:16px 18px;border:1px solid;margin-bottom:10px}
.ah{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.ait{font-size:13px;line-height:1.7;padding-left:16px;position:relative;margin-bottom:6px;color:var(--text)}
.ait::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%}
.ait strong{font-weight:600}
/* Print */
@media print{
  .topbar,.sel-bar,.print-btn{display:none!important}
  body{background:#fff;font-size:12px}
  .shell{padding:0;max-width:100%}
  .cg2{grid-template-columns:1fr 1fr}
  .cc{break-inside:avoid;border:1px solid #ccc}
  .note-item,.tp-item,.ac{break-inside:avoid}
  .sh{margin-top:16px}
  #report{display:block!important}
  .topbar-print{display:block!important;padding:8px 0;border-bottom:2px solid #1A1A2E;margin-bottom:16px}
}
.topbar-print{display:none}

.wb-dir{margin-bottom:20px}
.wb-dir-scores{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.wb-dir-sc{text-align:center;padding:14px 10px;border-radius:var(--r);border:1px solid}
.wb-dir-sl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.wb-dir-sv{font-size:26px;font-weight:700;line-height:1}
.wb-dir-ss{font-size:11px;margin-top:4px;line-height:1.4}
.wb-bgl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin:10px 0 7px;padding-bottom:3px;border-bottom:1px solid var(--bdr)}
.wb-br{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.wb-bl{font-size:12px;color:var(--t2);min-width:170px;line-height:1.3}
.wb-bt{flex:1;height:7px;background:var(--grey);border-radius:4px;overflow:hidden}
.wb-bf{height:7px;border-radius:4px}
.wb-bv{font-size:11px;color:var(--t2);min-width:60px;text-align:right}
.wb-ql{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin:12px 0 5px}
.wb-qt{font-size:13px;color:var(--text);line-height:1.7;font-style:italic;padding:10px 14px;background:var(--bg);border-radius:var(--r);border-left:3px solid var(--tmd)}
.wb-interp{background:var(--alt);border:1px solid var(--abd);border-radius:var(--r);padding:13px 16px;margin-top:14px;font-size:13px;color:var(--text);line-height:1.7}
.wb-interp strong{font-weight:600}
.wb-none{font-size:13px;color:var(--t3);font-style:italic;padding:12px}
.wb-conflict{background:var(--rlt);border:1px solid var(--rbd);border-radius:var(--r);padding:12px 15px;margin-top:10px;font-size:13px;color:var(--red);line-height:1.6}
.wb-align{background:var(--glt);border:1px solid var(--gbd);border-radius:var(--r);padding:12px 15px;margin-top:10px;font-size:13px;color:var(--grn);line-height:1.6}
</style>
</head>

  if(s==='Completed') return 'background:#D5F5E3;color:#1E8449';
  if(s==='In Progress') return 'background:#FAEEDA;color:#D4830A';
  if(s==='Planned') return 'background:#E6F1FB;color:#185FA5';
  return 'background:#FADBD8;color:#A32D2D';
}

function daysOut(s){
  if(!s) return null;
  var p=s.split('/');
  if(p.length!==3) return null;
  var d=new Date(parseInt(p[2]),parseInt(p[0])-1,parseInt(p[1]));
  return Math.round((d-TODAY)/86400000);
}

function loadProvider(key){
  if(!key){ document.getElementById('report').className=''; document.getElementById('report').innerHTML=''; destroyCharts(); return; }
  var d = DIR[key];
  if(!d){ return; }

  destroyCharts();

  var sentColor = d.sent==='Positive'?'#1E8449':d.sent==='Mixed'?'#D4830A':d.sent==='Concern'?'#A32D2D':'#888780';
  var sentBg    = d.sent==='Positive'?'#D5F5E3':d.sent==='Mixed'?'#FAEEDA':d.sent==='Concern'?'#FADBD8':'#F4F4F4';

  // KPI values
  var q1VpdAvg  = av(d.q1_vpd.filter(function(v){return v&&v>0;}));
  var q4VpdAvg  = av(d.q4_vpd.filter(function(v){return v&&v>0;}));
  var q1AhrAvg  = av(d.q1_ah);
  var q4AhrAvg  = av(d.q4_ah);
  var panCurrent= d.q1_pan[3];
  var panChange = (panCurrent!=null && d.q1_pan[0]!=null) ? panCurrent - d.q1_pan[0] : null;
  var naColor   = d.na_days==null?'':d.na_days>60?'r':d.na_days>30?'a':'g';
  var ahrColor  = q1AhrAvg==null?'':q1AhrAvg>15?'r':q1AhrAvg>8?'a':'g';

  // Build HTML
  var html = '';

  // Header
  html += '<div class="rh">';
  html += '<div>';
  html += '<div class="rn">' + d.full + '</div>';
  html += '<div class="rm">' + d.role + ' &nbsp;&middot;&nbsp; ' + d.dept + ' &nbsp;&middot;&nbsp; Started: ' + d.start + '</div>';
  if(d.na) html += '<div class="rm">Next available: <strong>' + d.na + '</strong>';
  if(d.na_days!=null) html += ' &nbsp;(' + d.na_days + ' days out)';
  if(d.nn) html += ' &nbsp;&middot;&nbsp; Next NP: <strong>' + d.nn + '</strong>';
  if(d.nn_days!=null) html += ' (' + d.nn_days + ' days)';
  if(d.na) html += '</div>';
  html += '</div>';
  html += '<div style="text-align:right">';
  html += '<span class="rs" style="background:' + sentBg + ';color:' + sentColor + '">' + d.sent + '</span>';
  html += '<div class="rs-note">' + d.sent_note + '</div>';
  html += '</div>';
  html += '</div>';

  // KPI cards
  html += '<div class="kg">';
  html += '<div class="kc"><div class="kl">VPD avg Q1</div><div class="kv">' + fn(q1VpdAvg) + '</div><div class="ks">Q4 2025 avg: ' + fn(q4VpdAvg) + '</div></div>';
  html += '<div class="kc"><div class="kl">After-hrs % Q1</div><div class="kv ' + ahrColor + '">' + fp(q1AhrAvg) + '</div><div class="ks">Q4 2025 avg: ' + fp(q4AhrAvg) + '</div></div>';
  if(panCurrent!=null) html += '<div class="kc"><div class="kl">Panel (Apr)</div><div class="kv">' + panCurrent + '</div><div class="ks">Change Jan-Apr: ' + (panChange>0?'+':'') + (panChange||0) + '</div></div>';
  if(d.pgr!=null) html += '<div class="kc"><div class="kl">Panel growth rate</div><div class="kv ' + (d.pgr>0?'g':d.pgr<-5?'r':'a') + '">' + (d.pgr>0?'+':'') + d.pgr + '/mo</div><div class="ks">Projected trend</div></div>';
  if(d.na_days!=null) html += '<div class="kc"><div class="kl">Next appt wait</div><div class="kv ' + naColor + '">' + d.na_days + ' days</div><div class="ks">' + (d.na||'') + '</div></div>';
  html += '<div class="kc"><div class="kl">Burnout risk</div><div class="kv" style="color:' + d.burn_col + '">' + d.burn_score + '/100</div><div class="ks">' + d.burn_level + '</div></div>';
  if(d.sg26!=null) html += '<div class="kc"><div class="kl">Surg cases YTD</div><div class="kv ' + (d.sg26>d.sg25?'g':'r') + '">' + d.sg26 + '</div><div class="ks">2025 YTD: ' + d.sg25 + '</div></div>';
  html += '</div>';

  // Burnout risk breakdown
  html += '<div class="sh">Burnout risk score</div>';
  html += '<div class="burn-wrap">';
  html += '<div class="burn-score-row">';
  html += '<div class="burn-score-circle" style="border-color:' + d.burn_col + ';color:' + d.burn_col + '">';
  html += '<span class="burn-score-num">' + d.burn_score + '</span>';
  html += '<span class="burn-score-label">' + d.burn_level + '</span>';
  html += '</div>';
  html += '<div class="burn-bars">';
  if(d.burn_ahr!=null){
    html += '<div class="bbar-row"><span class="bbar-label">After-hrs EHR %</span><div class="bbar-track"><div class="bbar-fill" style="width:' + Math.min(100,d.burn_ahr/25*100) + '%;background:' + d.burn_col + '"></div></div><span class="bbar-val">' + d.burn_ahr + '%</span></div>';
  }
  if(d.burn_msg!=null){
    html += '<div class="bbar-row"><span class="bbar-label">Msg center %</span><div class="bbar-track"><div class="bbar-fill" style="width:' + Math.min(100,d.burn_msg/25*100) + '%;background:' + d.burn_col + '"></div></div><span class="bbar-val">' + d.burn_msg + '%</span></div>';
  }
  if(d.burn_ehr!=null){
    html += '<div class="bbar-row"><span class="bbar-label">EHR doc time</span><div class="bbar-track"><div class="bbar-fill" style="width:' + Math.min(100,d.burn_ehr/30*100) + '%;background:' + d.burn_col + '"></div></div><span class="bbar-val">' + d.burn_ehr + ' min/pt</span></div>';
  }
  if(d.burn_nsr!=null){
    html += '<div class="bbar-row"><span class="bbar-label">No-show rate</span><div class="bbar-track"><div class="bbar-fill" style="width:' + Math.min(100,d.burn_nsr/10*100) + '%;background:' + d.burn_col + '"></div></div><span class="bbar-val">' + d.burn_nsr + '%</span></div>';
  }
  html += '</div></div>';
  html += '<div style="font-size:11px;color:var(--t3);margin-top:8px;line-height:1.5">Composite score: after-hrs % (40%) + message center % (25%) + EHR doc time (20%) + no-show rate (15%), normalized to 100. Higher = more at risk.</div>';
  html += '</div>';

  // Charts section
  html += '<div class="sh">Performance trends -- Q4 2025 (Jul-Oct) + Q1 2026 (Jan-Apr)</div>';
  var hasQ4 = d.q4_vpd.some(function(v){return v!=null&&v>0;});
  var hasPan = d.q1_pan[0]!=null;
  html += '<div class="cg2">';
  html += '<div class="cc"><div class="ct">Visits per day -- ' + (hasQ4?'Q4 2025 + ':' ') + 'Q1 2026</div><div class="cw" style="height:200px"><canvas id="dc-vpd"></canvas></div></div>';
  html += '<div class="cc"><div class="ct">After-hours EHR % -- ' + (hasQ4?'Q4 2025 + ':' ') + 'Q1 2026</div><div class="cw" style="height:200px"><canvas id="dc-ahr"></canvas></div></div>';
  html += '</div>';

  if(hasPan){
    html += '<div class="sh">Panel size -- trajectory + forecast</div>';
    html += '<div class="cg1"><div class="cc"><div class="ct">Panel size actual + projected through Oct 2026</div><div class="cw" style="height:240px"><canvas id="dc-pan"></canvas></div>';
    if(d.pgr!=null && d.pgr > 0){
      var projOct = Math.round(d.q1_pan[3] + d.pgr * 6);
      html += '<div class="forecast-note">At current growth rate of +' + d.pgr + ' patients/month, panel reaches approximately <strong>' + projOct + '</strong> by October 2026.';
      if(d.ptw && projOct >= d.ptw) html += ' This crosses the <strong>' + d.ptw + ' attention threshold</strong> within this period.';
      if(d.ptc && projOct >= d.ptc) html += ' <strong>Panel will reach the ' + d.ptc + ' capacity concern level</strong> -- planning action needed now.';
      html += '</div>';
    } else if(d.pgr!=null && d.pgr < 0){
      html += '<div class="forecast-note" style="color:#A32D2D">Panel declining at ' + d.pgr + ' patients/month. Investigate cause -- attrition, active management, or capacity limit?</div>';
    }
    html += '</div></div>';
  }

  if(d.sg26!=null){
    html += '<div class="sh">Surgical cases -- 2025 vs 2026</div>';
    html += '<div class="cg2">';
    html += '<div class="cc"><div class="ct">Surgical cases YTD -- 2025 vs 2026</div><div class="cw" style="height:200px"><canvas id="dc-surg"></canvas></div></div>';
    html += '<div class="cc"><div class="ct">Monthly surgical cases -- Q1 2026 (Jan-Mar)</div><div class="cw" style="height:200px"><canvas id="dc-surgmo"></canvas></div></div>';
    html += '</div>';
  }

  // Items of note
  html += '<div class="sh">Items of note -- before the interview</div>';
  html += '<div class="note-grid">';
  d.notes.forEach(function(n, i){
    html += '<div class="note-item">';
    html += '<div class="note-num">' + (i+1) + '</div>';
    html += '<div class="note-body"><div class="note-title">' + n.t + '</div><div class="note-text">' + n.b + '</div></div>';
    html += '</div>';
  });
  html += '</div>';

  // Action items
  html += '<div class="sh">Open action items from prior interviews</div>';
  html += '<table class="action-table"><thead><tr><th>Item</th><th>Status</th><th>Owner</th><th>Due</th></tr></thead><tbody>';
  d.actions.forEach(function(a){
    html += '<tr>';
    html += '<td style="font-weight:500">' + a.item + '</td>';
    html += '<td><span class="status-badge" style="' + statusStyle(a.status) + '">' + a.status + '</span></td>';
    html += '<td style="color:var(--t2)">' + a.owner + '</td>';
    html += '<td style="color:var(--t2)">' + a.due + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';

  // Talking points / conversation guide
  html += '<div class="sh">Conversation guide -- suggested talking points</div>';
  html += '<div class="tp-grid">';
  d.tp.forEach(function(tp, i){
    html += '<div class="tp-item">';
    html += '<div class="tp-num">' + (i+1) + '</div>';
    html += '<div class="tp-body"><div class="tp-label">' + tp.label + '</div>';
    html += '<div class="tp-q">&ldquo;' + tp.q + '&rdquo;</div></div>';
    html += '</div>';
  });
  html += '</div>';

  // Set HTML
  // Wellbeing survey - director interpretation
  var srv = (typeof SURVEY !== 'undefined') ? SURVEY[key] : null;
  var grp = (typeof SURVEY !== 'undefined') ? SURVEY._grp : null;
  html += '<div class="sh">Wellbeing survey &mdash; Q1 2026 (Maslach Burnout Inventory)</div>';
  html += '<div class="wb-dir">';
  if(srv && grp){
    var rl=['Never','Rarely','Sometimes','Often','Always'];
    var rc=['#1E8449','#5A9A72','#D4830A','#C0582A','#A32D2D'];
    var eeC=srv.ee>=51?'#A32D2D':(srv.ee>=26?'#D4830A':'#1E8449');
    var dpC=srv.dp>=41?'#A32D2D':(srv.dp>=21?'#D4830A':'#1E8449');
    var paC=srv.pa>=75?'#1E8449':(srv.pa>=50?'#D4830A':'#A32D2D');
    html += '<div class="wb-dir-scores">';
    html += '<div class="wb-dir-sc" style="background:'+eeC+'15;border-color:'+eeC+'55"><div class="wb-dir-sl" style="color:'+eeC+'">Emotional Exhaustion</div><div class="wb-dir-sv" style="color:'+eeC+'">'+srv.ee+'<span style="font-size:14px">%</span></div><div class="wb-dir-ss" style="color:'+eeC+'">'+srv.ee_level+'<br><span style="color:#888;font-size:10px">Group avg: '+grp.ee+'% &nbsp;|&nbsp; Max: 100%</span></div></div>';
    html += '<div class="wb-dir-sc" style="background:'+dpC+'15;border-color:'+dpC+'55"><div class="wb-dir-sl" style="color:'+dpC+'">Depersonalization</div><div class="wb-dir-sv" style="color:'+dpC+'">'+srv.dp+'<span style="font-size:14px">%</span></div><div class="wb-dir-ss" style="color:'+dpC+'">'+srv.dp_level+'<br><span style="color:#888;font-size:10px">Group avg: '+grp.dp+'% &nbsp;|&nbsp; Max: 100%</span></div></div>';
    html += '<div class="wb-dir-sc" style="background:'+paC+'15;border-color:'+paC+'55"><div class="wb-dir-sl" style="color:'+paC+'">Personal Accomplishment</div><div class="wb-dir-sv" style="color:'+paC+'">'+srv.pa+'<span style="font-size:14px">%</span></div><div class="wb-dir-ss" style="color:'+paC+'">'+srv.pa_level+'<br><span style="color:#888;font-size:10px">Group avg: '+grp.pa+'% &nbsp;|&nbsp; Higher is better</span></div></div>';
    html += '</div>';
    // Per-question bars
    [{l:'Emotional Exhaustion (lower is better)',idx:[0,1,2,3,4],bad:true},{l:'Depersonalization (lower is better)',idx:[5,6,7],bad:true},{l:'Personal Accomplishment (higher is better)',idx:[8,9,10,11],bad:false}].forEach(function(g){
      html += '<div class="wb-bgl">'+g.l+'</div>';
      g.idx.forEach(function(qi){
        var v=srv.q_resp[qi],pct=v/4*100,fc=g.bad?rc[v]:rc[4-v];
        html += '<div class="wb-br"><span class="wb-bl">'+srv.q_labels[qi]+'</span><div class="wb-bt"><div class="wb-bf" style="width:'+pct+'%;background:'+fc+'"></div></div><span class="wb-bv">'+rl[v]+'</span></div>';
      });
    });
    // Open-ended responses
    html += '<div class="wb-ql">What they enjoy most</div><div class="wb-qt">'+srv.likes+'</div>';
    html += '<div class="wb-ql">Their biggest challenge</div><div class="wb-qt">'+srv.challenge+'</div>';
    // Director-only clinical interpretation
    var burnScore = d ? d.burn_score : null;
    var interp = '';
    // Check alignment/conflict between survey and operational data
    if(burnScore != null){
      var surveyHighRisk = srv.ee >= 51 || srv.dp >= 41;
      var surveyModRisk  = srv.ee >= 26 || srv.dp >= 21;
      var dataHighRisk   = burnScore >= 65;
      var dataModRisk    = burnScore >= 40;
      if(surveyHighRisk && dataHighRisk){
        interp = '<div class="wb-conflict"><strong>Survey and operational data are aligned - elevated risk.</strong> Both the MBI scores and EHR/operational metrics point to meaningful burnout burden. This warrants a direct, private conversation about workload and support.</div>';
      } else if(surveyHighRisk && !dataModRisk){
        interp = '<div class="wb-conflict"><strong>Survey shows elevated risk that is not visible in operational data.</strong> EE or DP scores are above threshold but operational metrics look normal. This provider may be managing their workload efficiently while carrying internal emotional burden. Do not dismiss the survey signal.</div>';
      } else if(!surveyModRisk && dataHighRisk){
        interp = '<div class="wb-conflict"><strong>Operational data suggests risk that the survey does not confirm.</strong> The MBI scores are low but after-hours time, message center load, or EHR burden is elevated. The provider may be resilient, may not have self-identified burnout risk, or the survey may not have captured the full picture. Use the conversation to explore this gap.</div>';
      } else if(srv.pa < 50){
        interp = '<div class="wb-conflict"><strong>Low Personal Accomplishment is the primary signal here.</strong> Even with low EE and DP, a PA score below 50% suggests this provider is not finding meaningful satisfaction in their work. This is a retention and engagement risk worth exploring directly.</div>';
      } else if(!surveyModRisk && !dataModRisk && srv.pa >= 75){
        interp = '<div class="wb-align"><strong>Survey and operational data are aligned - low risk.</strong> MBI scores are low across all three subscales and personal accomplishment is strong. This is a genuinely healthy signal. Acknowledge it in the interview.</div>';
      } else {
        interp = '<div class="wb-align"><strong>Mixed but manageable picture.</strong> No acute risk signals in either the survey or the operational data. Use the conversation to check in on the specific subscales that are slightly elevated.</div>';
      }
    }
    html += interp;
  } else {
    html += '<div class="wb-none">This provider did not submit a survey response this quarter. Consider asking them directly during the interview whether they would be willing to complete it &mdash; or whether there is a reason they did not.</div>';
  }
  html += '</div>'; // /wb-dir

  var r = document.getElementById('report');
  r.className = 'on';
  r.innerHTML = html;

  // Draw charts
  requestAnimationFrame(function(){
    var teal = '#0F6E56'; var tmd = '#1D9E75'; var pur = '#534AB7';
    var red = '#A32D2D'; var gry = '#BBBBBB';
    var hasQ4data = d.q4_vpd.some(function(v){return v!=null&&v>0;});

    // VPD chart
    var vpdLabels = hasQ4data ? MO_ALL : MO_Q1;
    var vpdData   = hasQ4data ? d.q4_vpd.concat(d.q1_vpd) : d.q1_vpd;
    mkChart('dc-vpd',{type:'line',
      data:{labels:vpdLabels,datasets:[
        {label:'Visits/day',data:vpdData.map(function(v){return v&&v>0?v:null;}),
          borderColor:teal,backgroundColor:teal+'18',fill:true,pointRadius:4,borderWidth:2,tension:.3},
        ...(hasQ4data?[{label:'Q4/Q1 split',data:[null,null,null,null,null,null,null,null],borderColor:'transparent',borderWidth:0}]:[])
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
        annotation:{annotations:{split:{type:'line',xMin:3.5,xMax:3.5,borderColor:'#ccc',borderDash:[3,3],borderWidth:1}}}},
        scales:{y:{min:0,ticks:{font:{size:10}}},x:{ticks:{font:{size:9},autoSkip:false,maxRotation:45}}}}});

    // After-hours chart
    var ahrData = hasQ4data ? d.q4_ah.concat(d.q1_ah) : d.q1_ah;
    var ahrLabels = hasQ4data ? MO_ALL : MO_Q1;
    mkChart('dc-ahr',{type:'bar',
      data:{labels:ahrLabels,datasets:[
        {label:'After-hrs %',data:ahrData,
          backgroundColor:ahrData.map(function(v,i){
            if(v==null) return 'transparent';
            var isQ1 = hasQ4data ? i>=4 : true;
            return (v>15?red:v>8?'#D4830A':teal) + (isQ1?'CC':'88');
          }),
          borderColor:ahrData.map(function(v,i){
            if(v==null) return 'transparent';
            return v>15?red:v>8?'#D4830A':teal;
          }),
          borderWidth:1.5}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{y:{ticks:{callback:function(v){return v+'%';},font:{size:10}}},
                x:{ticks:{font:{size:9},autoSkip:false,maxRotation:45}}}}});

    // Panel chart with forecast
    if(d.q1_pan[0]!=null){
      var allPanLabels = ['Jan 26','Feb 26','Mar 26','Apr 26','May 26','Jun 26','Jul 26','Aug 26','Sep 26','Oct 26'];
      var actualPan    = d.q1_pan.concat([null,null,null,null,null,null]);
      var projPan      = [null,null,null,null];
      var last         = d.q1_pan[3];
      var rate         = d.pgr || 0;
      for(var m=0;m<6;m++) projPan.push(last + rate*(m+1));
      // connect at April
      projPan[3] = last;

      mkChart('dc-pan',{type:'line',
        data:{labels:allPanLabels,datasets:[
          {label:'Actual',data:actualPan,borderColor:pur,backgroundColor:pur+'14',fill:true,pointRadius:4,borderWidth:2,tension:.3},
          {label:'Projected',data:projPan,borderColor:pur,borderDash:[6,4],backgroundColor:'transparent',pointRadius:3,borderWidth:1.5,tension:.3},
          ...(d.ptw?[{label:''+d.ptw+' threshold',data:Array(10).fill(d.ptw),borderColor:'#FAC775',borderDash:[3,3],borderWidth:1,pointRadius:0,backgroundColor:'transparent'}]:[]),
          ...(d.ptc?[{label:''+d.ptc+' threshold',data:Array(10).fill(d.ptc),borderColor:red,borderDash:[3,3],borderWidth:1,pointRadius:0,backgroundColor:'transparent'}]:[]),
        ]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{y:{ticks:{font:{size:10}}},x:{ticks:{font:{size:9},autoSkip:false,maxRotation:45}}}}});
    }

    // Surgical charts
    if(d.sg26!=null){
      mkChart('dc-surg',{type:'bar',
        data:{labels:['2025 YTD','2026 YTD'],datasets:[
          {data:[d.sg25,d.sg26],
            backgroundColor:[gry+'BB', d.sg26>d.sg25?tmd+'CC':red+'CC'],
            borderColor:[gry, d.sg26>d.sg25?tmd:red],borderWidth:1.5}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:10}}}}}});

      mkChart('dc-surgmo',{type:'bar',
        data:{labels:['Jan','Feb','Mar'],datasets:[
          {data:d.sgm,backgroundColor:tmd+'99',borderColor:tmd,borderWidth:1.5}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:10}}}}}});
    }
  });
}
</script>
</body>
</html>
