<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic Queue Dashboard — Jan–Apr 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #e8eaed;
    --border: #d0d5dd;
    --text: #1a2030;
    --muted: #6b7280;
    --answered: #16a34a;
    --missed: #dc2626;
    --voicemail: #b45309;
    --accent: #2563eb;
    --answered-dim: rgba(22,163,74,0.12);
    --missed-dim: rgba(220,38,38,0.12);
    --voicemail-dim: rgba(180,83,9,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #ffffff 0%, #e8edf5 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 48px 28px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(88,166,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .header h1 em {
    color: var(--accent);
    font-style: italic;
  }
  .header-sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .header-stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .header-stat {
    text-align: right;
  }
  .header-stat .val {
    font-family: 'DM Mono', monospace;
    font-size: 1.5rem;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
  }
  .header-stat .lbl {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 3px;
  }

  /* NAV TABS */
  .nav-wrapper {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 48px;
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-wrapper::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 14px 18px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* MAIN */
  .main { padding: 36px 48px 0; }

  /* YTD SUMMARY ROW */
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .ytd-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 40px;
  }
  .ytd-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }
  .ytd-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s;
  }
  .ytd-card:hover, .ytd-card.selected {
    border-color: var(--accent);
    background: var(--surface2);
  }
  .ytd-card:hover::before, .ytd-card.selected::before { transform: scaleX(1); }

  .ytd-card .unit-name {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .ytd-card .rate {
    font-family: 'DM Mono', monospace;
    font-size: 1.7rem;
    font-weight: 500;
    line-height: 1;
    margin-bottom: 4px;
  }
  .ytd-card .rate.high { color: var(--answered); }
  .ytd-card .rate.med { color: var(--voicemail); }
  .ytd-card .rate.low { color: var(--missed); }
  .ytd-card .rate-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 10px; }

  .ytd-mini-bar {
    height: 5px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
    display: flex;
    gap: 1px;
    margin-bottom: 10px;
  }
  .ytd-mini-bar span { height: 100%; border-radius: 2px; }

  .ytd-nums {
    display: flex;
    gap: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
  }
  .ytd-nums .n { display: flex; align-items: center; gap: 4px; }
  .ytd-nums .dot { width: 6px; height: 6px; border-radius: 50%; }

  /* UNIT DETAIL PANEL */
  .unit-panel { display: none; animation: fadeIn 0.25s ease; }
  .unit-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .panel-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    font-weight: 400;
  }
  .panel-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    border: 1px solid;
  }
  .badge.green { color: var(--answered); border-color: var(--answered); background: var(--answered-dim); }
  .badge.red { color: var(--missed); border-color: var(--missed); background: var(--missed-dim); }
  .badge.yellow { color: var(--voicemail); border-color: var(--voicemail); background: var(--voicemail-dim); }
  .badge.blue { color: var(--accent); border-color: var(--accent); background: rgba(88,166,255,0.12); }

  /* CHARTS ROW */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 800px) { .charts-row { grid-template-columns: 1fr; } }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 20px 16px;
  }
  .chart-card h3 {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }
  .chart-wrap { position: relative; height: 220px; }

  .charts-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }
  @media (max-width: 900px) { .charts-row-3 { grid-template-columns: 1fr; } }

  /* MONTHLY TABLE */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 40px;
  }
  .table-card h3 {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 20px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th:not(:first-child) { text-align: right; }
  td {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(48,54,61,0.5);
  }
  td:not(:first-child) { text-align: right; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .td-rate { font-weight: 500; }
  .td-rate.high { color: var(--answered); }
  .td-rate.med { color: var(--voicemail); }
  .td-rate.low { color: var(--missed); }

  /* ANALYSIS */
  .analysis-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 40px;
  }
  @media (max-width: 800px) { .analysis-grid { grid-template-columns: 1fr; } }

  .insight-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .insight-card .ic-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .insight-card .ic-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1rem;
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .insight-card .ic-body {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.65;
  }
  .insight-card .ic-body strong { color: var(--text); }
  .insight-card.warn { border-color: rgba(248,81,73,0.35); }
  .insight-card.warn .ic-title { color: var(--missed); }
  .insight-card.good { border-color: rgba(63,185,80,0.35); }
  .insight-card.good .ic-title { color: var(--answered); }
  .insight-card.note { border-color: rgba(210,153,34,0.35); }
  .insight-card.note .ic-title { color: var(--voicemail); }
  .insight-card.info { border-color: rgba(88,166,255,0.35); }
  .insight-card.info .ic-title { color: var(--accent); }

  .divider { border: none; border-top: 1px solid var(--border); margin: 36px 0; }

  /* OVERVIEW panel */
  .overview-panel { display: none; }
  .overview-panel.active { display: block; }

  .all-units-chart-wrap { position: relative; height: 300px; margin-bottom: 32px; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>Clinic Queue <em>Analytics</em></h1>
      <div class="header-sub">January – April 2026 &nbsp;·&nbsp; 8 Units &nbsp;·&nbsp; Call Volume &amp; Outcomes</div>
    </div>
    <div class="header-stats" id="headerStats"></div>
  </div>
</div>

<div class="nav-wrapper">
  <button class="tab-btn active" onclick="showTab('overview')">Overview</button>
  <button class="tab-btn" onclick="showTab('BH')">BH</button>
  <button class="tab-btn" onclick="showTab('General Surgery')">General Surgery</button>
  <button class="tab-btn" onclick="showTab('Green Team')">Green Team</button>
  <button class="tab-btn" onclick="showTab('Ortho')">Ortho</button>
  <button class="tab-btn" onclick="showTab('Red Team')">Red Team</button>
  <button class="tab-btn" onclick="showTab('Specialty')">Specialty</button>
  <button class="tab-btn" onclick="showTab('Blue Team')">Blue Team</button>
  <button class="tab-btn" onclick="showTab('Clinic Triage')">Clinic Triage</button>
</div>

<div class="main" id="mainContent"></div>

<script>
const DATA = {
  "BH": {
    "monthly": [
      {"month":1,"monthName":"Jan","answered":379,"missed":14,"voicemail":13,"total":406,"answerRate":93.3},
      {"month":2,"monthName":"Feb","answered":312,"missed":15,"voicemail":3,"total":330,"answerRate":94.5},
      {"month":3,"monthName":"Mar","answered":347,"missed":13,"voicemail":4,"total":364,"answerRate":95.3},
      {"month":4,"monthName":"Apr","answered":322,"missed":5,"voicemail":9,"total":336,"answerRate":95.8}
    ],
    "ytd": {"answered":1360,"missed":47,"voicemail":29,"total":1436,"answerRate":94.7}
  },
  "General Surgery": {
    "monthly": [
      {"month":1,"monthName":"Jan","answered":15,"missed":3,"voicemail":27,"total":45,"answerRate":33.3},
      {"month":2,"monthName":"Feb","answered":9,"missed":3,"voicemail":17,"total":29,"answerRate":31.0},
      {"month":3,"monthName":"Mar","answered":17,"missed":2,"voicemail":20,"total":39,"answerRate":43.6},
      {"month":4,"monthName":"Apr","answered":15,"missed":0,"voicemail":16,"total":31,"answerRate":48.4}
    ],
    "ytd": {"answered":56,"missed":8,"voicemail":80,"total":144,"answerRate":38.9}
  },
  "Green Team": {
    "monthly": [
      {"month":1,"monthName":"Jan","answered":63,"missed":18,"voicemail":157,"total":238,"answerRate":26.5},
      {"month":2,"monthName":"Feb","answered":53,"missed":15,"voicemail":138,"total":206,"answerRate":25.7},
      {"month":3,"monthName":"Mar","answered":25,"missed":4,"voicemail":106,"total":135,"answerRate":18.5},
      {"month":4,"monthName":"Apr","answered":40,"missed":15,"voicemail":102,"total":157,"answerRate":25.5}
    ],
    "ytd": {"answered":181,"missed":52,"voicemail":503,"total":736,"answerRate":24.6}
  },
  "Ortho": {
    "monthly": [
      {"month":1,"monthName":"Jan","answered":17,"missed":4,"voicemail":95,"total":116,"answerRate":14.7},
      {"month":2,"monthName":"Feb","answered":22,"missed":10,"voicemail":57,"total":89,"answerRate":24.7},
      {"month":3,"monthName":"Mar","answered":29,"missed":7,"voicemail":52,"total":88,"answerRate":33.0},
      {"month":4,"monthName":"Apr","answered":12,"missed":8,"voicemail":59,"total":79,"answerRate":15.2}
    ],
    "ytd": {"answered":80,"missed":29,"voicemail":263,"total":372,"answerRate":21.5}
  },
  "Red Team": {
    "monthly": [
      {"month":1,"monthName":"Jan","answered":40,"missed":4,"voicemail":97,"total":141,"answerRate":28.4},
      {"month":2,"monthName":"Feb","answered":81,"missed":18,"voicemail":117,"total":216,"answerRate":37.5},
      {"month":3,"monthName":"Mar","answered":68,"missed":9,"voicemail":200,"total":277,"answerRate":24.5},
      {"month":4,"monthName":"Apr","answered":87,"missed":9,"voicemail":181,"total":277,"answerRate":31.4}
    ],
    "ytd": {"answered":276,"missed":40,"voicemail":595,"total":911,"answerRate":30.3}
  },
  "Specialty": {
    "monthly": [
      {"month":1,"monthName":"Jan","answered":27,"missed":11,"voicemail":127,"total":165,"answerRate":16.4},
      {"month":2,"monthName":"Feb","answered":22,"missed":11,"voicemail":113,"total":146,"answerRate":15.1},
      {"month":3,"monthName":"Mar","answered":20,"missed":14,"voicemail":140,"total":174,"answerRate":11.5},
      {"month":4,"monthName":"Apr","answered":18,"missed":15,"voicemail":122,"total":155,"answerRate":11.6}
    ],
    "ytd": {"answered":87,"missed":51,"voicemail":502,"total":640,"answerRate":13.6}
  },
  "Blue Team": {
    "monthly": [
      {"month":1,"monthName":"Jan","answered":409,"missed":70,"voicemail":263,"total":742,"answerRate":55.1},
      {"month":2,"monthName":"Feb","answered":802,"missed":152,"voicemail":195,"total":1149,"answerRate":69.8},
      {"month":3,"monthName":"Mar","answered":801,"missed":183,"voicemail":150,"total":1134,"answerRate":70.6},
      {"month":4,"monthName":"Apr","answered":821,"missed":199,"voicemail":129,"total":1149,"answerRate":71.5}
    ],
    "ytd": {"answered":2833,"missed":604,"voicemail":737,"total":4174,"answerRate":67.9}
  },
  "Clinic Triage": {
    "monthly": [
      {"month":1,"monthName":"Jan","answered":113,"missed":33,"voicemail":129,"total":275,"answerRate":41.1},
      {"month":2,"monthName":"Feb","answered":110,"missed":33,"voicemail":138,"total":281,"answerRate":39.1},
      {"month":3,"monthName":"Mar","answered":146,"missed":35,"voicemail":81,"total":262,"answerRate":55.7},
      {"month":4,"monthName":"Apr","answered":123,"missed":23,"voicemail":104,"total":250,"answerRate":49.2}
    ],
    "ytd": {"answered":492,"missed":124,"voicemail":452,"total":1068,"answerRate":46.1}
  }
};

const UNITS = Object.keys(DATA);
const MONTHS = ['Jan','Feb','Mar','Apr'];
const chartInstances = {};

function rateClass(r) {
  if (r >= 80) return 'high';
  if (r >= 40) return 'med';
  return 'low';
}

function totalYTD() {
  let a=0,m=0,v=0,t=0;
  UNITS.forEach(u => { a+=DATA[u].ytd.answered; m+=DATA[u].ytd.missed; v+=DATA[u].ytd.voicemail; t+=DATA[u].ytd.total; });
  return {answered:a,missed:m,voicemail:v,total:t, answerRate: Math.round(a/t*1000)/10};
}

// Header stats
(function() {
  const tot = totalYTD();
  const el = document.getElementById('headerStats');
  el.innerHTML = `
    <div class="header-stat"><div class="val">${tot.total.toLocaleString()}</div><div class="lbl">Total Calls YTD</div></div>
    <div class="header-stat"><div class="val" style="color:var(--answered)">${tot.answerRate}%</div><div class="lbl">Avg Answer Rate</div></div>
    <div class="header-stat"><div class="val" style="color:var(--missed)">${tot.missed.toLocaleString()}</div><div class="lbl">Missed YTD</div></div>
  `;
})();

function destroyChart(id) {
  if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
}

function makeChart(id, config) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (ctx) chartInstances[id] = new Chart(ctx, config);
}

const gridColor = 'rgba(208,213,221,0.7)';
const tickColor = '#6b7280';
const baseChartOpts = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1a2030', borderColor: '#d0d5dd', borderWidth: 1, titleColor: '#f9fafb', bodyColor: '#9ca3af', padding: 10 } },
  scales: {
    x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'DM Mono', size: 11 } } },
    y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'DM Mono', size: 11 } } }
  }
};

function buildOverview() {
  const el = document.getElementById('mainContent');
  const tot = totalYTD();

  // YTD cards
  let ytdCards = '';
  UNITS.forEach(u => {
    const d = DATA[u].ytd;
    const rc = rateClass(d.answerRate);
    const aW = Math.round(d.answered/d.total*100);
    const mW = Math.round(d.missed/d.total*100);
    const vW = 100-aW-mW;
    ytdCards += `
      <div class="ytd-card" onclick="showTab('${u.replace(/'/g,"\\'")}')">
        <div class="unit-name">${u}</div>
        <div class="rate ${rc}">${d.answerRate}%</div>
        <div class="rate-label">Answer Rate</div>
        <div class="ytd-mini-bar">
          <span style="width:${aW}%;background:var(--answered)"></span>
          <span style="width:${mW}%;background:var(--missed)"></span>
          <span style="width:${vW}%;background:var(--voicemail)"></span>
        </div>
        <div class="ytd-nums">
          <span class="n"><span class="dot" style="background:var(--answered)"></span>${d.answered.toLocaleString()}</span>
          <span class="n"><span class="dot" style="background:var(--missed)"></span>${d.missed}</span>
          <span class="n"><span class="dot" style="background:var(--voicemail)"></span>${d.voicemail}</span>
        </div>
      </div>`;
  });

  el.innerHTML = `
    <div class="overview-panel active" id="panel-overview">
      <div class="section-label">YTD Summary — Click a unit to drill down</div>
      <div class="ytd-grid">${ytdCards}</div>

      <div class="section-label">Answer Rate by Unit — Monthly Trend</div>
      <div class="chart-card" style="margin-bottom:32px">
        <h3>Answer Rate % — All Units (Jan–Apr)</h3>
        <div style="position:relative;height:280px"><canvas id="overviewLine"></canvas></div>
      </div>

      <div class="section-label">Total Call Volume — All Units YTD</div>
      <div class="charts-row" style="margin-bottom:32px">
        <div class="chart-card">
          <h3>Call Volume by Unit (YTD)</h3>
          <div class="chart-wrap"><canvas id="overviewBar"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Outcome Distribution — All Units Combined</h3>
          <div class="chart-wrap"><canvas id="overviewDoughnut"></canvas></div>
        </div>
      </div>

      <div class="section-label">Analysis &amp; Insights</div>
      <div class="analysis-grid">
        <div class="insight-card good">
          <div class="ic-label">Top Performer</div>
          <div class="ic-title">BH leads with a 94.7% answer rate</div>
          <div class="ic-body">BH answered <strong>1,360 of 1,436 calls</strong> YTD — the highest answer rate across all units and the only one above 90%. The rate has been steadily improving each month, reaching <strong>95.8% in April</strong>. Very low voicemail usage (29 total) suggests strong live staffing.</div>
        </div>
        <div class="insight-card warn">
          <div class="ic-label">Critical Concern</div>
          <div class="ic-title">Specialty's answer rate has declined to 11.6%</div>
          <div class="ic-body">Specialty went from <strong>16.4% in January to just 11.5% in March</strong>, with minimal recovery in April (11.6%). With 502 voicemails out of 640 calls YTD, patients are overwhelmingly reaching voicemail — nearly <strong>8 in 10 calls</strong> go unanswered live. Urgent staffing or workflow review warranted.</div>
        </div>
        <div class="insight-card note">
          <div class="ic-label">Voicemail Dependency</div>
          <div class="ic-title">5 of 8 units route majority of calls to voicemail</div>
          <div class="ic-body">Green Team (68%), Ortho (71%), Red Team (65%), Specialty (78%), and Clinic Triage (42%) all have high voicemail rates. <strong>Blue Team</strong> has shown improvement — voicemail dropped from 263 in January to 129 in April as volume nearly tripled, suggesting operational changes took hold mid-period.</div>
        </div>
        <div class="insight-card info">
          <div class="ic-label">Volume Leader</div>
          <div class="ic-title">Blue Team handles 45% of all clinic call volume</div>
          <div class="ic-body">Blue Team processed <strong>4,174 calls YTD</strong> — more than the other 7 units combined. Volume surged from 742 in January to ~1,149/month in Feb–Apr. Despite the volume jump, answer rate climbed from <strong>55% to 71.5%</strong>, showing effective scaling.</div>
        </div>
        <div class="insight-card note">
          <div class="ic-label">Trend Watch</div>
          <div class="ic-title">Ortho improved strongly then reversed in April</div>
          <div class="ic-body">Ortho's answer rate improved from <strong>14.7% → 33.0%</strong> Jan–Mar, a meaningful gain. April dropped sharply back to <strong>15.2%</strong> — call volume also fell from 88 to 79, which may indicate staffing changes or a scheduling disruption. Worth investigating before a full reversal takes hold.</div>
        </div>
        <div class="insight-card good">
          <div class="ic-label">Positive Trend</div>
          <div class="ic-title">General Surgery eliminating missed calls</div>
          <div class="ic-body">General Surgery had <strong>zero missed calls in April</strong>, down from 3 per month Jan–Feb. While overall volume is low (144 calls YTD) and the answer rate remains modest at 38.9% due to high voicemail, the missed call improvement shows better real-time coverage. Answer rate trended up from 33% to 48% by April.</div>
        </div>
      </div>
    </div>`;

  setTimeout(() => {
    // Line chart — answer rates
    const unitColors = ['#3fb950','#58a6ff','#d29922','#f85149','#a371f7','#39d353','#79c0ff','#ffa657'];
    makeChart('overviewLine', {
      type: 'line',
      data: {
        labels: MONTHS,
        datasets: UNITS.map((u,i) => ({
          label: u,
          data: DATA[u].monthly.map(m => m.answerRate),
          borderColor: unitColors[i],
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6,
          tension: 0.35
        }))
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 12, padding: 16 } },
          tooltip: { backgroundColor: '#1a2030', borderColor: '#d0d5dd', borderWidth: 1, titleColor: '#f9fafb', bodyColor: '#9ca3af', padding: 10,
            callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y}%` }
          }
        },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'DM Mono', size: 11 } } },
          y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'DM Mono', size: 11 }, callback: v => v+'%' }, min: 0, max: 100 }
        }
      }
    });

    // Bar chart
    makeChart('overviewBar', {
      type: 'bar',
      data: {
        labels: UNITS,
        datasets: [
          { label: 'Answered', data: UNITS.map(u => DATA[u].ytd.answered), backgroundColor: 'rgba(63,185,80,0.75)', borderRadius: 4 },
          { label: 'Missed', data: UNITS.map(u => DATA[u].ytd.missed), backgroundColor: 'rgba(248,81,73,0.75)', borderRadius: 4 },
          { label: 'Voicemail', data: UNITS.map(u => DATA[u].ytd.voicemail), backgroundColor: 'rgba(210,153,34,0.75)', borderRadius: 4 }
        ]
      },
      options: {
        ...baseChartOpts,
        plugins: { ...baseChartOpts.plugins, legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 12, padding: 12 } } },
        scales: { ...baseChartOpts.scales, x: { ...baseChartOpts.scales.x, stacked: true, ticks: { color: tickColor, font: { family: 'DM Mono', size: 9 } } }, y: { ...baseChartOpts.scales.y, stacked: true } }
      }
    });

    // Doughnut
    const tot = totalYTD();
    makeChart('overviewDoughnut', {
      type: 'doughnut',
      data: {
        labels: ['Answered','Missed','Voicemail'],
        datasets: [{ data: [tot.answered, tot.missed, tot.voicemail], backgroundColor: ['rgba(63,185,80,0.85)','rgba(248,81,73,0.85)','rgba(210,153,34,0.85)'], borderColor: '#ffffff', borderWidth: 3, hoverOffset: 6 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '65%',
        plugins: {
          legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 12, padding: 14 } },
          tooltip: { backgroundColor: '#1a2030', borderColor: '#d0d5dd', borderWidth: 1, titleColor: '#f9fafb', bodyColor: '#9ca3af', padding: 10,
            callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed.toLocaleString()} (${Math.round(ctx.parsed/tot.total*1000)/10}%)` }
          }
        }
      }
    });
  }, 50);
}

function buildUnitPanel(unit) {
  const d = DATA[unit];
  const ytd = d.ytd;
  const rc = rateClass(ytd.answerRate);
  const months = d.monthly;

  // trend arrow
  const first = months[0].answerRate;
  const last = months[months.length-1].answerRate;
  const trend = last - first;
  const trendStr = trend > 0 ? `↑ +${trend.toFixed(1)}% since Jan` : trend < 0 ? `↓ ${trend.toFixed(1)}% since Jan` : '→ Flat';
  const trendColor = trend > 0 ? 'var(--answered)' : trend < 0 ? 'var(--missed)' : 'var(--muted)';

  // Table rows
  let tableRows = '';
  months.forEach(m => {
    const rc2 = rateClass(m.answerRate);
    tableRows += `<tr>
      <td>${m.monthName}</td>
      <td>${m.total.toLocaleString()}</td>
      <td style="color:var(--answered)">${m.answered.toLocaleString()}</td>
      <td style="color:var(--missed)">${m.missed}</td>
      <td style="color:var(--voicemail)">${m.voicemail}</td>
      <td class="td-rate ${rc2}">${m.answerRate}%</td>
    </tr>`;
  });
  tableRows += `<tr style="background:rgba(48,54,61,0.3)">
    <td style="font-weight:600">YTD</td>
    <td style="font-weight:600">${ytd.total.toLocaleString()}</td>
    <td style="color:var(--answered);font-weight:600">${ytd.answered.toLocaleString()}</td>
    <td style="color:var(--missed);font-weight:600">${ytd.missed}</td>
    <td style="color:var(--voicemail);font-weight:600">${ytd.voicemail}</td>
    <td class="td-rate ${rc}" style="font-weight:600">${ytd.answerRate}%</td>
  </tr>`;

  const panelId = 'panel-' + unit.replace(/\s+/g,'_');
  const el = document.getElementById('mainContent');
  el.innerHTML = `
    <div class="unit-panel active" id="${panelId}">
      <div class="panel-header">
        <div class="panel-title">${unit}</div>
        <div class="panel-badges">
          <span class="badge blue">${ytd.total.toLocaleString()} calls YTD</span>
          <span class="badge ${rc === 'high' ? 'green' : rc === 'med' ? 'yellow' : 'red'}">${ytd.answerRate}% answer rate</span>
          <span style="font-family:'DM Mono',monospace;font-size:0.75rem;color:${trendColor};align-self:center;">${trendStr}</span>
        </div>
      </div>

      <div class="charts-row">
        <div class="chart-card">
          <h3>Monthly Call Volume</h3>
          <div class="chart-wrap"><canvas id="unit_bar_${panelId}"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Answer Rate Trend (%)</h3>
          <div class="chart-wrap"><canvas id="unit_line_${panelId}"></canvas></div>
        </div>
      </div>

      <div class="charts-row-3">
        <div class="chart-card">
          <h3>YTD Outcome Mix</h3>
          <div class="chart-wrap"><canvas id="unit_dough_${panelId}"></canvas></div>
        </div>
        <div class="chart-card" style="grid-column:span 2">
          <h3>Answered vs Voicemail vs Missed — Monthly</h3>
          <div class="chart-wrap"><canvas id="unit_stack_${panelId}"></canvas></div>
        </div>
      </div>

      <div class="table-card">
        <h3>Monthly Breakdown</h3>
        <table>
          <thead><tr><th>Month</th><th>Total</th><th>Answered</th><th>Missed</th><th>Voicemail</th><th>Answer Rate</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>`;

  setTimeout(() => {
    // Stacked bar
    makeChart(`unit_bar_${panelId}`, {
      type: 'bar',
      data: {
        labels: MONTHS,
        datasets: [
          { label: 'Answered', data: months.map(m=>m.answered), backgroundColor: 'rgba(63,185,80,0.8)', borderRadius: 3 },
          { label: 'Missed', data: months.map(m=>m.missed), backgroundColor: 'rgba(248,81,73,0.8)', borderRadius: 3 },
          { label: 'Voicemail', data: months.map(m=>m.voicemail), backgroundColor: 'rgba(210,153,34,0.8)', borderRadius: 3 }
        ]
      },
      options: {
        ...baseChartOpts,
        plugins: { ...baseChartOpts.plugins, legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 10, padding: 10 } } },
        scales: { x: { ...baseChartOpts.scales.x, stacked: true }, y: { ...baseChartOpts.scales.y, stacked: true } }
      }
    });

    // Line
    makeChart(`unit_line_${panelId}`, {
      type: 'line',
      data: {
        labels: MONTHS,
        datasets: [{
          label: 'Answer Rate %',
          data: months.map(m=>m.answerRate),
          borderColor: '#58a6ff',
          backgroundColor: 'rgba(88,166,255,0.1)',
          borderWidth: 2.5,
          pointRadius: 5,
          pointHoverRadius: 7,
          fill: true,
          tension: 0.35
        }]
      },
      options: {
        ...baseChartOpts,
        scales: {
          x: { ...baseChartOpts.scales.x },
          y: { ...baseChartOpts.scales.y, min: 0, max: 100, ticks: { ...baseChartOpts.scales.y.ticks, callback: v=>v+'%' } }
        }
      }
    });

    // Doughnut
    makeChart(`unit_dough_${panelId}`, {
      type: 'doughnut',
      data: {
        labels: ['Answered','Missed','Voicemail'],
        datasets: [{ data: [ytd.answered, ytd.missed, ytd.voicemail], backgroundColor: ['rgba(63,185,80,0.85)','rgba(248,81,73,0.85)','rgba(210,153,34,0.85)'], borderColor: '#ffffff', borderWidth: 3 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: {
          legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 10, padding: 10 } },
          tooltip: { backgroundColor: '#1a2030', borderColor: '#d0d5dd', borderWidth: 1, titleColor: '#f9fafb', bodyColor: '#9ca3af', padding: 10,
            callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} (${Math.round(ctx.parsed/ytd.total*1000)/10}%)` }
          }
        }
      }
    });

    // Grouped line (pct)
    makeChart(`unit_stack_${panelId}`, {
      type: 'bar',
      data: {
        labels: MONTHS,
        datasets: [
          { label: 'Answered', data: months.map(m=>m.answered), backgroundColor: 'rgba(63,185,80,0.75)', borderRadius: 3 },
          { label: 'Missed', data: months.map(m=>m.missed), backgroundColor: 'rgba(248,81,73,0.75)', borderRadius: 3 },
          { label: 'Voicemail', data: months.map(m=>m.voicemail), backgroundColor: 'rgba(210,153,34,0.75)', borderRadius: 3 }
        ]
      },
      options: {
        ...baseChartOpts,
        plugins: { ...baseChartOpts.plugins, legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 10, padding: 10 } } }
      }
    });
  }, 50);
}

let currentTab = 'overview';

function showTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === name || (name === 'overview' && b.textContent.trim() === 'Overview'));
  });
  Object.values(chartInstances).forEach(c => c.destroy());
  Object.keys(chartInstances).forEach(k => delete chartInstances[k]);

  if (name === 'overview') buildOverview();
  else buildUnitPanel(name);
}

// Initial render
buildOverview();
</script>
</body>
</html>
