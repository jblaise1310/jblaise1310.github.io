<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic Queue Dashboard — Jan–Apr 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #e8eaed;
    --border: #d0d5dd;
    --text: #1a2030;
    --muted: #6b7280;
    --answered: #16a34a;
    --missed: #dc2626;
    --voicemail: #b45309;
    --accent: #2563eb;
    --answered-dim: rgba(22,163,74,0.12);
    --missed-dim: rgba(220,38,38,0.12);
    --voicemail-dim: rgba(180,83,9,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #ffffff 0%, #e8edf5 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 48px 28px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(88,166,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .header h1 em {
    color: var(--accent);
    font-style: italic;
  }
  .header-sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .header-stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .header-stat {
    text-align: right;
  }
  .header-stat .val {
    font-family: 'DM Mono', monospace;
    font-size: 1.5rem;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
  }
  .header-stat .lbl {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 3px;
  }

  /* NAV TABS */
  .nav-wrapper {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 48px;
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-wrapper::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 14px 18px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* MAIN */
  .main { padding: 36px 48px 0; }

  /* YTD SUMMARY ROW */
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .ytd-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 40px;
  }
  .ytd-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }
  .ytd-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s;
  }
  .ytd-card:hover, .ytd-card.selected {
    border-color: var(--accent);
    background: var(--surface2);
  }
  .ytd-card:hover::before, .ytd-card.selected::before { transform: scaleX(1); }

  .ytd-card .unit-name {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .ytd-card .rate {
    font-family: 'DM Mono', monospace;
    font-size: 1.7rem;
    font-weight: 500;
    line-height: 1;
    margin-bottom: 4px;
  }
  .ytd-card .rate.high { color: var(--answered); }
  .ytd-card .rate.med { color: var(--voicemail); }
  .ytd-card .rate.low { color: var(--missed); }
  .ytd-card .rate-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 10px; }

  .ytd-mini-bar {
    height: 5px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
    display: flex;
    gap: 1px;
    margin-bottom: 10px;
  }
  .ytd-mini-bar span { height: 100%; border-radius: 2px; }

  .ytd-nums {
    display: flex;
    gap: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
  }
  .ytd-nums .n { display: flex; align-items: center; gap: 4px; }
  .ytd-nums .dot { width: 6px; height: 6px; border-radius: 50%; }

  /* UNIT DETAIL PANEL */
  .unit-panel { display: none; animation: fadeIn 0.25s ease; }
  .unit-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .panel-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    font-weight: 400;
  }
  .panel-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    border: 1px solid;
  }
  .badge.green { color: var(--answered); border-color: var(--answered); background: var(--answered-dim); }
  .badge.red { color: var(--missed); border-color: var(--missed); background: var(--missed-dim); }
  .badge.yellow { color: var(--voicemail); border-color: var(--voicemail); background: var(--voicemail-dim); }
  .badge.blue { color: var(--accent); border-color: var(--accent); background: rgba(88,166,255,0.12); }

  /* CHARTS ROW */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 800px) { .charts-row { grid-template-columns: 1fr; } }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 20px 16px;
  }
  .chart-card h3 {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }
  .chart-wrap { position: relative; height: 220px; }

  .charts-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }
  @media (max-width: 900px) { .charts-row-3 { grid-template-columns: 1fr; } }

  /* MONTHLY TABLE */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 40px;
  }
  .table-card h3 {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 20px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th:not(:first-child) { text-align: right; }
  td {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(48,54,61,0.5);
  }
  td:not(:first-child) { text-align: right; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .td-rate { font-weight: 500; }
  .td-rate.high { color: var(--answered); }
  .td-rate.med { color: var(--voicemail); }
  .td-rate.low { color: var(--missed); }

  /* ANALYSIS */
  .analysis-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 40px;
  }
  @media (max-width: 800px) { .analysis-grid { grid-template-columns: 1fr; } }

  .insight-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .insight-card .ic-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .insight-card .ic-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1rem;
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .insight-card .ic-body {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.65;
  }
  .insight-card .ic-body strong { color: var(--text); }
  .insight-card.warn { border-color: rgba(248,81,73,0.35); }
  .insight-card.warn .ic-title { color: var(--missed); }
  .insight-card.good { border-color: rgba(63,185,80,0.35); }
  .insight-card.good .ic-title { color: var(--answered); }
  .insight-card.note { border-color: rgba(210,153,34,0.35); }
  .insight-card.note .ic-title { color: var(--voicemail); }
  .insight-card.info { border-color: rgba(88,166,255,0.35); }
  .insight-card.info .ic-title { color: var(--accent); }

  .divider { border: none; border-top: 1px solid var(--border); margin: 36px 0; }

  /* OVERVIEW panel */
  .overview-panel { display: none; }
  .overview-panel.active { display: block; }

  .all-units-chart-wrap { position: relative; height: 300px; margin-bottom: 32px; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .new-badge { background: var(--accent); color: #fff; font-family:'DM Mono',monospace; font-size:0.58rem; padding:2px 6px; border-radius:10px; margin-left:6px; vertical-align:middle; letter-spacing:0.05em; }
  .qbar-row { display:flex; align-items:center; gap:12px; padding:10px 20px; border-bottom:1px solid rgba(48,54,61,0.35); font-family:'DM Mono',monospace; font-size:0.78rem; }
  .qbar-row:last-child { border-bottom:none; }
  .qbar-label { width:140px; flex-shrink:0; color:var(--text); }
  .qbar-track { flex:1; height:8px; background:var(--surface2); border-radius:4px; overflow:hidden; }
  .qbar-fill { height:100%; background:var(--voicemail); border-radius:4px; }
  .qbar-val { width:150px; text-align:right; color:var(--muted); flex-shrink:0; }
  .source-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:40px; }
  @media (max-width:800px){ .source-grid{grid-template-columns:1fr;} }
  .stat-mini-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px; }
  @media (max-width:800px){ .stat-mini-grid{grid-template-columns:1fr;} }
  .stat-mini { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px 18px; }
  .stat-mini .sm-label{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  .stat-mini .sm-val{font-family:'DM Mono',monospace;font-size:1.4rem;font-weight:500;}
  .stat-mini .sm-sub{font-size:0.75rem;color:var(--muted);margin-top:4px;}
  .burst-row td { font-size: 0.76rem; }
  .burst-tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:0.68rem; margin-right:4px; }
  .burst-tag.vm { background:var(--voicemail-dim); color:var(--voicemail); }
  .burst-tag.na { background:var(--missed-dim); color:var(--missed); }
</style>
</head>

  <div class="header-top">

function rateClass(r) {
  if (r >= 80) return 'high';
  if (r >= 40) return 'med';
  return 'low';
}

function fmtSec(s) {
  s = Math.round(s);
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function fmtDT(iso) {
  const d = new Date(iso);
  return d.toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}

function totalYTD() {
  let a=0,n=0,v=0,t=0;
  UNITS.forEach(u => { a+=DATA[u].ytd.answered; n+=DATA[u].ytd.noAnswer; v+=DATA[u].ytd.voicemail; t+=DATA[u].ytd.total; });
  return { answered:a, noAnswer:n, voicemail:v, total:t, answerRate: t ? Math.round(a/t*1000)/10 : 0 };
}

          <div class="ic-label">Critical Concern</div>
          <div class="ic-title">Specialty and Ortho remain the weakest live-answer units</div>
          <div class="ic-body">Specialty (15.8% YTD) and Ortho (19.9% YTD) still route the large majority of calls to voicemail. Specialty did improve in May&ndash;June (19.4% &rarr; 20.7%) after bottoming out at 11.5&ndash;11.6% in Mar&ndash;Apr, but Ortho slipped back down to 16.0% in June after a 33.0% high in March &mdash; a pattern worth a staffing review.</div>
        </div>
        <div class="insight-card note">
          <div class="ic-label">Voicemail Quality</div>
          <div class="ic-title">IT's Blue Team observation generalizes across units</div>
          <div class="ic-body">IT flagged a Blue Team extension calling repeatedly with ~4-second voicemails. The full May&ndash;June data confirms that pattern (Blue Team ext. 3855, 5 calls in 28 minutes, avg 3.2s) and shows it recurring elsewhere &mdash; see the burst table above. Overall, <strong>54 of 1,616 voicemails (3.3%)</strong> clinic-wide are under 10 seconds, meaning the call reached voicemail but almost certainly no message was left, so a callback list built purely from "left a voicemail" counts would overstate real follow-up needs.</div>
        </div>
        <div class="insight-card info">
          <div class="ic-label">New Queue</div>
          <div class="ic-title">Pain Management is now being tracked separately</div>
          <div class="ic-body">This is the first report period with Pain Management broken out as its own queue. It ran a <strong>28.8% answer rate</strong> on 66 calls in May&ndash;June, with the majority (45 of 66) going to voicemail &mdash; a starting baseline to compare future months against.</div>
        </div>
        <div class="insight-card note">
          <div class="ic-label">Known Data Gap</div>
          <div class="ic-title">IT could not identify which staff member answered each call</div>
          <div class="ic-body">Because Queue-level reporting shows the queue number as the answering party, none of the outcome or duration figures above can currently be attributed to an individual. This affects any future analysis of individual staff performance &mdash; worth flagging as a system limitation rather than a coverage gap.</div>
        </div>
      </div>
    </div>`;

  setTimeout(() => {
    const unitColors = ['#3fb950','#58a6ff','#d29922','#f85149','#a371f7','#39d353','#79c0ff','#ffa657','#ff7eb6'];
    makeChart('overviewLine', {
      type: 'line',
      data: {
        labels: MONTHS,
        datasets: UNITS.map((u,i) => ({
          label: u,
          data: DATA[u].monthly.map(m => m.answerRate),
          borderColor: unitColors[i],
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6,
          tension: 0.35,
          spanGaps: true
        }))
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 12, padding: 16 } },
          tooltip: { backgroundColor: '#1a2030', borderColor: '#d0d5dd', borderWidth: 1, titleColor: '#f9fafb', bodyColor: '#9ca3af', padding: 10,
            callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y}%` }
          }
        },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'DM Mono', size: 11 } } },
          y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'DM Mono', size: 11 }, callback: v => v+'%' }, min: 0, max: 100 }
        }
      }
    });

    makeChart('overviewBar', {
      type: 'bar',
      data: {
        labels: UNITS,
        datasets: [
          { label: 'Answered', data: UNITS.map(u => DATA[u].ytd.answered), backgroundColor: 'rgba(63,185,80,0.75)', borderRadius: 4 },
          { label: 'No Answer', data: UNITS.map(u => DATA[u].ytd.noAnswer), backgroundColor: 'rgba(248,81,73,0.75)', borderRadius: 4 },
          { label: 'Voicemail', data: UNITS.map(u => DATA[u].ytd.voicemail), backgroundColor: 'rgba(210,153,34,0.75)', borderRadius: 4 }
        ]
      },
      options: {
        ...baseChartOpts,
        plugins: { ...baseChartOpts.plugins, legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 12, padding: 12 } } },
        scales: { ...baseChartOpts.scales, x: { ...baseChartOpts.scales.x, stacked: true, ticks: { color: tickColor, font: { family: 'DM Mono', size: 9 } } }, y: { ...baseChartOpts.scales.y, stacked: true } }
      }
    });

    const tot = totalYTD();
    makeChart('overviewDoughnut', {
      type: 'doughnut',
      data: {
        labels: ['Answered','No Answer','Voicemail'],
        datasets: [{ data: [tot.answered, tot.noAnswer, tot.voicemail], backgroundColor: ['rgba(63,185,80,0.85)','rgba(248,81,73,0.85)','rgba(210,153,34,0.85)'], borderColor: '#ffffff', borderWidth: 3, hoverOffset: 6 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '65%',
        plugins: {
          legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 12, padding: 14 } },
          tooltip: { backgroundColor: '#1a2030', borderColor: '#d0d5dd', borderWidth: 1, titleColor: '#f9fafb', bodyColor: '#9ca3af', padding: 10,
            callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed.toLocaleString()} (${Math.round(ctx.parsed/tot.total*1000)/10}%)` }
          }
        }
      }
    });

    const durLabels = Object.keys(DURATION_DISTRIBUTION);
    makeChart('overviewDuration', {
      type: 'bar',
      data: {
        labels: durLabels,
        datasets: [{ label: 'Answered Calls', data: durLabels.map(k => DURATION_DISTRIBUTION[k]), backgroundColor: 'rgba(88,166,255,0.7)', borderRadius: 4 }]
      },
      options: { ...baseChartOpts }
    });
  }, 50);
}

function buildUnitPanel(unit) {
  const d = DATA[unit];
  const ytd = d.ytd;
  const rc = rateClass(ytd.answerRate);
  const months = d.monthly;
  const monthLabels = months.map(m => m.monthName);
  const vmq = VM_QUALITY[unit] || {totalVoicemails:0, shortVoicemails:0, shortPct:0};
  const dur = DURATION_STATS[unit] || {avgSec:0, medianSec:0, maxSec:0, count:0};
  const src = SOURCE_BREAKDOWN[unit] || {internalCalls:0, externalCalls:0, topInternal:[], topExternal:[]};
  const unitBursts = BURSTS.filter(b => b.team === unit);

  const first = months[0].answerRate;
  const last = months[months.length-1].answerRate;
  const trend = last - first;
  const trendStr = trend > 0 ? `↑ +${trend.toFixed(1)}% since ${months[0].monthName}` : trend < 0 ? `↓ ${trend.toFixed(1)}% since ${months[0].monthName}` : '→ Flat';
  const trendColor = trend > 0 ? 'var(--answered)' : trend < 0 ? 'var(--missed)' : 'var(--muted)';

  let tableRows = '';
  months.forEach(m => {
    const rc2 = rateClass(m.answerRate);
    tableRows += `<tr>
      <td>${m.monthName}</td>
      <td>${m.total.toLocaleString()}</td>
      <td style="color:var(--answered)">${m.answered.toLocaleString()}</td>
      <td style="color:var(--missed)">${m.noAnswer}</td>
      <td style="color:var(--voicemail)">${m.voicemail}</td>
      <td class="td-rate ${rc2}">${m.answerRate}%</td>
    </tr>`;
  });
  tableRows += `<tr style="background:rgba(48,54,61,0.3)">
    <td style="font-weight:600">Total</td>
    <td style="font-weight:600">${ytd.total.toLocaleString()}</td>
    <td style="color:var(--answered);font-weight:600">${ytd.answered.toLocaleString()}</td>
    <td style="color:var(--missed);font-weight:600">${ytd.noAnswer}</td>
    <td style="color:var(--voicemail);font-weight:600">${ytd.voicemail}</td>
    <td class="td-rate ${rc}" style="font-weight:600">${ytd.answerRate}%</td>
  </tr>`;

  let internalRows = src.topInternal.map(x => `<tr><td>Ext. ${x.ext}</td><td>${x.count}</td></tr>`).join('');
  if (!internalRows) internalRows = '<tr><td colspan="2" style="color:var(--muted)">No internal calls logged</td></tr>';
  let externalRows = src.topExternal.map(x => `<tr><td>${x.number}</td><td>${x.count}</td></tr>`).join('');
  if (!externalRows) externalRows = '<tr><td colspan="2" style="color:var(--muted)">No external calls logged</td></tr>';

  let burstAlert = '';
  if (unitBursts.length) {
    const rows = unitBursts.map(b => {
      const outcomeTags = Object.entries(b.outcomes).map(([k,v]) => {
        const cls = k === 'Voicemail' ? 'vm' : (k === 'No Answer' ? 'na' : '');
        return `<span class="burst-tag ${cls}">${v} ${k}</span>`;
      }).join('');
      return `<tr class="burst-row"><td>${b.source}</td><td>${b.count}</td><td>${fmtDT(b.start)} &ndash; ${fmtDT(b.end)}</td><td>${fmtSec(b.avgDuration)}</td><td>${outcomeTags}</td></tr>`;
    }).join('');
    burstAlert = `
      <div class="table-card">
        <h3>Repeat-Caller Bursts &mdash; This Unit (May&ndash;Jun)</h3>
        <table>
          <thead><tr><th>Source</th><th>Calls</th><th>Window</th><th>Avg Duration</th><th>Outcomes</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  const newBadge = d.isNew ? '<span class="badge blue">Newly tracked this period</span>' : '';

  const panelId = 'panel-' + unit.replace(/\s+/g,'_');
  const el = document.getElementById('mainContent');
  el.innerHTML = `
    <div class="unit-panel active" id="${panelId}">
      <div class="panel-header">
        <div class="panel-title">${unit}</div>
        <div class="panel-badges">
          ${newBadge}
          <span class="badge blue">${ytd.total.toLocaleString()} calls${d.isNew ? ' (May-Jun)' : ' (Jan-Jun)'}</span>
          <span class="badge ${rc === 'high' ? 'green' : rc === 'med' ? 'yellow' : 'red'}">${ytd.answerRate}% answer rate</span>
          <span style="font-family:'DM Mono',monospace;font-size:0.75rem;color:${trendColor};align-self:center;">${trendStr}</span>
        </div>
      </div>

      <div class="charts-row">
        <div class="chart-card">
          <h3>Monthly Call Volume</h3>
          <div class="chart-wrap"><canvas id="unit_bar_${panelId}"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Answer Rate Trend (%)</h3>
          <div class="chart-wrap"><canvas id="unit_line_${panelId}"></canvas></div>
        </div>
      </div>

      <div class="charts-row-3">
        <div class="chart-card">
          <h3>Outcome Mix</h3>
          <div class="chart-wrap"><canvas id="unit_dough_${panelId}"></canvas></div>
        </div>
        <div class="chart-card" style="grid-column:span 2">
          <h3>Answered vs Voicemail vs No Answer &mdash; Monthly</h3>
          <div class="chart-wrap"><canvas id="unit_stack_${panelId}"></canvas></div>
        </div>
      </div>

      <div class="section-label">Call Patterns (May&ndash;Jun Detail)</div>
      <div class="stat-mini-grid">
        <div class="stat-mini">
          <div class="sm-label">Avg Talk Time (Answered)</div>
          <div class="sm-val">${dur.count ? fmtSec(dur.avgSec) : '&mdash;'}</div>
          <div class="sm-sub">Median ${dur.count ? fmtSec(dur.medianSec) : '&mdash;'} &middot; ${dur.count} answered calls</div>
        </div>
        <div class="stat-mini">
          <div class="sm-label">Voicemails Under 10 Sec</div>
          <div class="sm-val" style="color:${vmq.shortPct > 5 ? 'var(--voicemail)' : 'var(--text)'}">${vmq.shortPct}%</div>
          <div class="sm-sub">${vmq.shortVoicemails} of ${vmq.totalVoicemails} voicemails likely have no message</div>
        </div>
        <div class="stat-mini">
          <div class="sm-label">Call Source Mix</div>
          <div class="sm-val">${src.internalCalls}<span style="font-size:0.9rem;color:var(--muted)"> internal</span></div>
          <div class="sm-sub">${src.externalCalls} external (outside line)</div>
        </div>
      </div>

      <div class="source-grid">
        <div class="table-card" style="margin-bottom:0">
          <h3>Top Internal Extensions (May&ndash;Jun)</h3>
          <table><thead><tr><th>Extension</th><th>Calls</th></tr></thead><tbody>${internalRows}</tbody></table>
        </div>
        <div class="table-card" style="margin-bottom:0">
          <h3>Top External Numbers (May&ndash;Jun)</h3>
          <table><thead><tr><th>Number</th><th>Calls</th></tr></thead><tbody>${externalRows}</tbody></table>
        </div>
      </div>

      ${burstAlert}

      <div class="table-card">
        <h3>Monthly Breakdown</h3>
        <table>
          <thead><tr><th>Month</th><th>Total</th><th>Answered</th><th>No Answer</th><th>Voicemail</th><th>Answer Rate</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>`;

  setTimeout(() => {
    makeChart(`unit_bar_${panelId}`, {
      type: 'bar',
      data: {
        labels: monthLabels,
        datasets: [
          { label: 'Answered', data: months.map(m=>m.answered), backgroundColor: 'rgba(63,185,80,0.8)', borderRadius: 3 },
          { label: 'No Answer', data: months.map(m=>m.noAnswer), backgroundColor: 'rgba(248,81,73,0.8)', borderRadius: 3 },
          { label: 'Voicemail', data: months.map(m=>m.voicemail), backgroundColor: 'rgba(210,153,34,0.8)', borderRadius: 3 }
        ]
      },
      options: {
        ...baseChartOpts,
        plugins: { ...baseChartOpts.plugins, legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 10, padding: 10 } } },
        scales: { x: { ...baseChartOpts.scales.x, stacked: true }, y: { ...baseChartOpts.scales.y, stacked: true } }
      }
    });

    makeChart(`unit_line_${panelId}`, {
      type: 'line',
      data: {
        labels: monthLabels,
        datasets: [{
          label: 'Answer Rate %',
          data: months.map(m=>m.answerRate),
          borderColor: '#58a6ff',
          backgroundColor: 'rgba(88,166,255,0.1)',
          borderWidth: 2.5,
          pointRadius: 5,
          pointHoverRadius: 7,
          fill: true,
          tension: 0.35
        }]
      },
      options: {
        ...baseChartOpts,
        scales: {
          x: { ...baseChartOpts.scales.x },
          y: { ...baseChartOpts.scales.y, min: 0, max: 100, ticks: { ...baseChartOpts.scales.y.ticks, callback: v=>v+'%' } }
        }
      }
    });

    makeChart(`unit_dough_${panelId}`, {
      type: 'doughnut',
      data: {
        labels: ['Answered','No Answer','Voicemail'],
        datasets: [{ data: [ytd.answered, ytd.noAnswer, ytd.voicemail], backgroundColor: ['rgba(63,185,80,0.85)','rgba(248,81,73,0.85)','rgba(210,153,34,0.85)'], borderColor: '#ffffff', borderWidth: 3 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: {
          legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 10, padding: 10 } },
          tooltip: { backgroundColor: '#1a2030', borderColor: '#d0d5dd', borderWidth: 1, titleColor: '#f9fafb', bodyColor: '#9ca3af', padding: 10,
            callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} (${Math.round(ctx.parsed/ytd.total*1000)/10}%)` }
          }
        }
      }
    });

    makeChart(`unit_stack_${panelId}`, {
      type: 'bar',
      data: {
        labels: monthLabels,
        datasets: [
          { label: 'Answered', data: months.map(m=>m.answered), backgroundColor: 'rgba(63,185,80,0.75)', borderRadius: 3 },
          { label: 'No Answer', data: months.map(m=>m.noAnswer), backgroundColor: 'rgba(248,81,73,0.75)', borderRadius: 3 },
          { label: 'Voicemail', data: months.map(m=>m.voicemail), backgroundColor: 'rgba(210,153,34,0.75)', borderRadius: 3 }
        ]
      },
      options: {
        ...baseChartOpts,
        plugins: { ...baseChartOpts.plugins, legend: { display: true, position: 'bottom', labels: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, boxWidth: 10, padding: 10 } } }
      }
    });
  }, 50);
}

let currentTab = 'overview';

function showTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  Object.values(chartInstances).forEach(c => c.destroy());
  Object.keys(chartInstances).forEach(k => delete chartInstances[k]);

  if (name === 'overview') buildOverview();
  else buildUnitPanel(name);
}

buildOverview();
</script>
</body>
</html>
